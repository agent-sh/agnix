  invalid_glob_pattern: '忽略无效的 glob 模式 ''%{pattern}'': %{error}'
  invalid_glob_pattern_suggestion: '修复 glob 模式语法。使用标准 glob 字符: *, **, ?, [abc]'
  cc_sk_021:
    message: 硬编码的用户目录路径 '%{path}' 会泄露作者身份，且在不同机器间不可移植
    suggestion: 改用 '~/'、'$HOME/'、相对于项目的路径，或像 '$PROJECT_ROOT' 这样的环境变量。shebang 行建议使用 '#!/usr/bin/env <解释器>'。
  cln_005:
    message: Cline 工作流文件为空
