      PreCompact'
  cl_sk_002:
    message: Cline 技能缺少必需的 frontmatter 'name' 字段
    suggestion: 在 SKILL.md 的 frontmatter 中添加 'name' 字段
  cl_sk_003:
    message: Cline 技能缺少必需的 frontmatter 'description' 字段
    suggestion: 在 SKILL.md 的 frontmatter 中添加 'description' 字段
  gm_010:
    message: experimental.memoryManager 已启用但未设置 experimental.autoMemory（Gemini CLI v0.40+ 已拆分这两个标志）
    suggestion: '在 memoryManager 旁同时设置 experimental.autoMemory: true，以保持 v0.40 之后后台技能提取和 /memory inbox 正常工作（参见 https://github.com/google-gemini/gemini-cli/pull/25601）'
  cdx_pl_015:
    message: '''skills'' 必须是字符串路径，而不是 %{actual}'
    suggestion: 将 'skills' 设置为相对路径字符串（如 './skills'），或移除此字段
  cc_set_006:
    message: disableBundledSkills 存在时必须是布尔值 (实际为 %{actual}); Claude Code 2.1.169+ 对该设置只记录严格的 true/false
    suggestion: 将 disableBundledSkills 设置为不带引号的 true 或 false，或改为将环境变量 CLAUDE_CODE_DISABLE_BUNDLED_SKILLS 设置为 1。
  cc_set_007:
    message: enforceAvailableModels 存在时必须是布尔值 (实际为 %{actual}); Claude Code 2.1.175+ 将该托管设置记录为严格的 true/false 开关
    suggestion: 将 enforceAvailableModels 设置为不带引号的 true 或 false，以便可预测地强制执行托管 availableModels 允许列表。
  cc_set_008:
    message: sandbox.allowAppleEvents 存在时必须是布尔值 (实际为 %{actual}); Claude Code 2.1.181+ 将该 sandbox 选项记录为严格的 true/false 开关
    suggestion: 将 sandbox.allowAppleEvents 设置为不带引号的 true 或 false，或移除此字段以让 macOS sandbox 继续阻止 Apple Events。
  cc_set_009:
    message: attribution.sessionUrl 存在时必须是布尔值 (实际为 %{actual}); Claude Code 2.1.183+ 将该归因选项记录为严格的 true/false 设置
    suggestion: 将 attribution.sessionUrl 设置为不带引号的 true 或 false。使用 false 可在 Web 或 Remote Control 会话创建的 commit 和 PR 描述中省略 claude.ai 会话链接。
  cc_set_012:
    credentials_object: sandbox.credentials 必须是包含可选 files 和 envVars 数组的对象（实际为 %{actual}）
    credentials_object_suggestion: '将 sandbox.credentials 设置为对象，例如 {"files":[{"path":"~/.aws/credentials","mode":"deny"}],"envVars":[{"name":"GITHUB_TOKEN","mode":"deny"}]}，或移除此字段。'
    allow_plaintext_type: sandbox.credentials.allowPlaintextInject 必须是布尔值（实际为 %{actual}）
    allow_plaintext_suggestion: 将 sandbox.credentials.allowPlaintextInject 设置为不带引号的 true 或 false，或移除此字段。
    entries_array: sandbox.credentials.%{array_key} 必须是数组（实际为 %{actual}）
    entries_array_suggestion: '将 sandbox.credentials.%{array_key} 设置为对象数组，每个对象包含 "%{required_key}"，且 "mode" 为 "deny" 或 "mask"。'
    entry_object: sandbox.credentials.%{array_key}[%{index}] 必须是对象（实际为 %{actual}）
    entry_object_suggestion: 'sandbox.credentials.%{array_key} 中的每个条目应使用 {"%{required_key}": "...", "mode": "deny"} 或 {"%{required_key}": "...", "mode": "mask"}。'
    required_empty: sandbox.credentials.%{array_key}[%{index}].%{required_key} 不能为空
    required_type: sandbox.credentials.%{array_key}[%{index}].%{required_key} 必须是字符串（实际为 %{actual}）
    required_suggestion: 将 sandbox.credentials.%{array_key}[%{index}].%{required_key} 设置为标识凭据目标的非空字符串。
    env_name: 'sandbox.credentials.%{array_key}[%{index}].name 必须以字母或下划线开头，且只能包含字母、数字和下划线（实际为 "%{name}"）'
    env_name_suggestion: 将 sandbox.credentials.%{array_key}[%{index}].name 设置为有效的环境变量名称，例如 GITHUB_TOKEN。
    mode_value: 'sandbox.credentials.%{array_key}[%{index}].mode 必须是 "deny" 或 "mask"（实际为 "%{mode}"）'
    mode_type: 'sandbox.credentials.%{array_key}[%{index}].mode 必须是 "deny" 或 "mask"（实际为 %{actual}）'
    mode_suggestion: '将 sandbox.credentials.%{array_key}[%{index}].mode 设置为 "deny" 或 "mask"。'
    inject_hosts_array: sandbox.credentials.%{array_key}[%{index}].injectHosts 必须是字符串数组（实际为 %{actual}）
    inject_hosts_suggestion: 将 sandbox.credentials.%{array_key}[%{index}].injectHosts 设置为主机字符串数组，或移除此字段。
    inject_host_type: sandbox.credentials.%{array_key}[%{index}].injectHosts[%{host_index}] 必须是字符串（实际为 %{actual}）
    inject_host_suggestion: 将 sandbox.credentials.%{array_key}[%{index}].injectHosts[%{host_index}] 替换为主机字符串。
    mask_file: 'mode 为 "mask" 时，sandbox.credentials.%{array_key}[%{index}].path 必须标识单个文件'
    mask_file_suggestion: '列出要屏蔽的具体凭据文件，或对目录使用 mode "deny"。'
    extract_regex: sandbox.credentials.%{array_key}[%{index}].extract 必须是有效的 ECMAScript 正则表达式（%{error}）
    extract_regex_suggestion: 修复 sandbox.credentials.%{array_key}[%{index}].extract 中的正则表达式语法，或移除 extract 以屏蔽整个文件。
    extract_capture: 'mode 为 "mask" 时，sandbox.credentials.%{array_key}[%{index}].extract 必须包含捕获组'
    extract_capture_suggestion: '向 sandbox.credentials.%{array_key}[%{index}].extract 添加凭据捕获组，例如 "token:\s*(\S+)"，或移除 extract 以屏蔽整个文件。'
    extract_type: sandbox.credentials.%{array_key}[%{index}].extract 必须是正则表达式字符串（实际为 %{actual}）
    extract_type_suggestion: 将 sandbox.credentials.%{array_key}[%{index}].extract 设置为包含凭据捕获组的正则表达式字符串，或移除此字段。
    extract_no_match_value: 'sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch 必须是 "warn"、"deny" 或 "error"（实际为 "%{actual}"）'
    extract_no_match_type: sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch 必须是字符串（实际为 %{actual}）
    extract_no_match_suggestion: '将 sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch 设置为 "warn"、"deny" 或 "error"。'
    extract_no_match_jwt_value: '环境变量使用 decode: "jwt" 时，sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch 必须是 "warn"（实际为 "%{actual}"）'
    extract_no_match_jwt_suggestion: '将 sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch 设置为 "warn"，或移除此字段。'
    mask_duplicates_type: sandbox.credentials.%{array_key}[%{index}].maskDuplicates 必须是布尔值（实际为 %{actual}）
    mask_duplicates_suggestion: 将 sandbox.credentials.%{array_key}[%{index}].maskDuplicates 设置为不带引号的 true 或 false，或移除此字段。
    decode_value: 'sandbox.credentials.%{array_key}[%{index}].decode 必须是 "jwt"（实际为 "%{actual}"）'
    decode_type: sandbox.credentials.%{array_key}[%{index}].decode 必须是字符串（实际为 %{actual}）
    decode_suggestion: '将 sandbox.credentials.%{array_key}[%{index}].decode 设置为 "jwt"，或移除此字段。'
    extract_decode_conflict: 环境变量的 sandbox.credentials.%{array_key}[%{index}] 不能同时设置 extract 和 decode
    extract_decode_conflict_suggestion: 从 sandbox.credentials.%{array_key}[%{index}] 中移除 extract 或 decode。
    mask_claims_shape: sandbox.credentials.%{array_key}[%{index}].maskClaims 必须是包含非空字符串的非空数组（实际为 %{actual}）
    mask_claims_requires_decode: 'sandbox.credentials.%{array_key}[%{index}].maskClaims 需要 decode: "jwt"'
    mask_claims_suggestion: '将 decode 设置为 "jwt"，并将 maskClaims 设置为类似 ["api_key"] 的声明名称，或移除 maskClaims。'
    aws_pairs_array: sandbox.credentials.awsPairs 必须是对象数组（实际为 %{actual}）
    aws_pair_object: sandbox.credentials.awsPairs[%{index}] 必须是对象（实际为 %{actual}）
    aws_pair_field: sandbox.credentials.awsPairs[%{index}].%{field} 必须是非空字符串
    aws_pairs_suggestion: '使用类似 {"accessKeyIdVar":"MY_KEY_ID","secretAccessKeyVar":"MY_SECRET_KEY"} 的条目，可选设置 sessionTokenVar。'
    sigv4_object: sandbox.credentials.sigv4 必须是对象（实际为 %{actual}）
    sigv4_entry: 'sandbox.credentials.sigv4.%{field} 必须是 deny 或 passthrough，且字段必须是 streaming、presigned 或 sigv4a（实际为 %{actual}）'
    sigv4_suggestion: 将 streaming、presigned 和 sigv4a 策略设置为 deny 或 passthrough，或移除不支持的字段。
    tls_terminate_required: 通过 sandbox.credentials.%{feature} 重新签署 AWS 凭证时，sandbox.network.tlsTerminate 必须是对象
    tls_terminate_suggestion: '将 sandbox.network.tlsTerminate 设置为对象（例如 {}），或移除 AWS 凭证重新签署设置。'
  cc_set_013:
    message: autoMode.classifyAllShell 存在时必须是布尔值 (实际为 %{actual}); Claude Code 2.1.193+ 将该 auto-mode 设置记录为严格的 true/false 开关
    suggestion: 将 autoMode.classifyAllShell 设置为不带引号的 true 或 false，或移除此字段以保留默认的 auto-mode 分类器范围。
  cc_set_014:
    message: Claude Code 2.1.207 起，.claude/settings.local.json 中的 autoMode 将被静默忽略；该键仅从 ~/.claude/settings.json 读取
    suggestion: 将 autoMode 配置移至 ~/.claude/settings.json（全局用户配置文件），Claude Code 2.1.207+ 将从该文件读取。
