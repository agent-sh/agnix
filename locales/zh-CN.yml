    message: sandbox.filesystem.disabled 存在时必须是布尔值 (实际为 %{actual})；Claude Code 2.1.216+ 使用此设置关闭文件系统隔离，同时保留网络隔离
    suggestion: 将 sandbox.filesystem.disabled 设置为不带引号的 true 或 false，或移除此字段以保持文件系统隔离。
  cc_set_018:
    message: emojiCompletionEnabled 存在时必须是布尔值 (实际为 %{actual})；Claude Code 2.1.217+ 使用此设置控制命名表情符号补全
    suggestion: 将 emojiCompletionEnabled 设置为不带引号的 true 或 false，或移除此字段以保持表情符号补全。
  cc_set_019:
    message: sandbox.network.strictAllowlist 存在时必须是布尔值（实际为 %{actual}）
    suggestion: 将 sandbox.network.strictAllowlist 设置为不带引号的 true 或 false，或移除此字段。
  cc_set_020:
    message: workflowSizeGuideline 必须是 unrestricted、small、medium 或 large（实际为 %{actual}）
    suggestion: 将 workflowSizeGuideline 设置为 unrestricted、small、medium 或 large。
  cc_set_021:
    message: 'Claude Code 2.1.222+ 无法通过项目设置中的 remoteControlAtStartup: true 启用远程控制；该值会被忽略'
    suggestion: 使用 /config 在用户设置中启用远程控制，或在此处将该字段设置为 false 以针对项目禁用。
  cc_set_022:
    message: crossSessionInbound 必须是 accept、hold 或 refuse（实际为 %{actual}）
    suggestion: 将 crossSessionInbound 设置为 accept、hold 或 refuse。
  cc_set_023:
    message: dialogExpiry 必须是 60s、5m、10m 或 never（实际为 %{actual}）
    suggestion: 将 dialogExpiry 设置为 60s、5m、10m 或 never。


