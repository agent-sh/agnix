    message: 自 Claude Code 2.1.207 起，项目级 .claude 设置中的 pluginConfigs 会被静默忽略；插件选项值仅从用户设置、--settings 文件和托管设置中读取
    suggestion: 将 pluginConfigs 移至 ~/.claude/settings.json（用户级），通过 --settings 标志传入，或在托管设置中配置；并从项目级文件中删除。
