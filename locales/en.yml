    suggestion: Read the value from an environment variable or from a file outside the repository
  kiro_001:
    message: "Invalid steering inclusion mode '%{value}' - valid modes are always, fileMatch, manual and auto (case-sensitive)"
    suggestion: "Use one of: always, fileMatch, manual, auto. Kiro CLI V3 ignores frontmatter with an invalid mode and includes the whole file, frontmatter text included, in every interaction"
  kiro_002_auto:
    message: "Steering file with inclusion 'auto' has no description, so Kiro never loads it automatically (it is only offered as a slash command)"
    suggestion: "Add a description that says when Kiro should load this file"
  kiro_002_filematch:
    message: "Steering file with inclusion 'fileMatch' has no fileMatchPattern, so Kiro never loads it"
    suggestion: "Add a fileMatchPattern glob or a list of globs (e.g., fileMatchPattern: \"**/*.ts\")"
  kiro_003_comma:
    message: "fileMatchPattern '%{pattern}' has a comma outside braces, which Kiro matches as a literal character, not as 'or'"
    suggestion: "List alternatives as an array (fileMatchPattern: [\"*.ts\", \"*.tsx\"]) or use braces (**/*.{ts,tsx})"
  kiro_003_bracket:
    message: "fileMatchPattern '%{pattern}' has a '[' that is never closed, so Kiro matches it as a literal '['"
    suggestion: "Close the character class with ']' or escape the bracket"
  kiro_004:
    message: Kiro steering file is empty
    suggestion: Add steering content to the file
  kiro_005:
    message: Kiro steering file has frontmatter but no instruction body
    suggestion: Add meaningful steering instructions below the frontmatter
  kiro_006:
    message: Potential secret detected in Kiro steering content (%{marker})
    suggestion: Remove hardcoded credentials and reference environment variables instead
  kiro_007:
    message: fileMatchPattern is present but inclusion is '%{inclusion}' instead of 'fileMatch'
    suggestion: 'Set inclusion: fileMatch or remove fileMatchPattern'
  kiro_008:
    message: Unknown Kiro steering frontmatter field '%{field}'
    suggestion: 'Use only supported fields: inclusion, name, description, fileMatchPattern'
  kiro_008_scope:
    message: "Unknown Kiro steering frontmatter field '%{field}'"
    suggestion: "Kiro ignores '%{field}'; to load this file only for matching files, use inclusion: fileMatch with fileMatchPattern"
