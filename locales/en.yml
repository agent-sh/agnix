# ===========================================================================
# Rules - Validator diagnostic messages, suggestions, assumptions, fixes
# ===========================================================================
rules:
  kr_hk_014:
    alias: "Hook trigger alias %{trigger} is accepted; the canonical name is %{canonical}"
    alias_suggestion: "Use the canonical PascalCase trigger when editing V3 hooks. Kiro maps the alias to it, so both behave the same."
    fix: "Normalize hook trigger to %{canonical}"
    legacy: "Legacy .kiro.hook uses CLI trigger spelling %{trigger} without a corresponding V3 JSON hook in this directory"
    legacy_suggestion: "If this hook is intended for CLI V3, migrate it to a versioned .kiro/hooks/*.json file. Legacy IDE manual hooks can remain in their original format."
  kr_pm_001:
    parse_error: "Kiro cannot load this permissions file (%{error}); it rejects every rule in it and fails closed, denying all tool calls until the file is fixed"
    shape: "Kiro permissions must be a mapping containing a rules array; an empty file or any other shape is rejected and Kiro fails closed, denying all tool calls"
    entry: "Permission rule at index %{index} must be a mapping; Kiro rejects the whole file and fails closed, denying all tool calls"
    suggestion: "Use rules: [] or a list of capability/effect mappings in permissions.yaml."
  kr_pm_002:
    missing: "Permission rule at index %{index} has a missing or non-string capability; Kiro rejects the whole file and fails closed, denying all tool calls"
    unknown: "Permission rule at index %{index} has unknown capability '%{capability}'; Kiro skips this rule"
    suggestion: "Use a documented capability such as shell, fs_read, fs_write, mcp, or a meta-capability (all, builtin, filesystem)."
  kr_pm_003:
    message: "Permission rule at index %{index} has a missing or invalid effect; %{consequence}"
    evaluate: "Permission rule at index %{index} uses effect 'evaluate', which Kiro does not support yet; the rule is skipped"
    scope: "Permission rule at index %{index} uses effect '%{effect}', which an administrator managed-settings.json cannot contain; %{consequence}"
    suggestion: "Set effect to allow, deny, or ask. Review the policy before changing access."
    admin_suggestion: "Administrator policies may only deny or ask; grant allow rules in user, workspace or agent permissions instead."
  kr_pm_004:
    message: "Permission rule at index %{index}: %{field} must be an array of strings; %{consequence}"
    suggestion: "Use a list of quoted glob patterns. Omit match for unrestricted scope; exclude is optional."
  kr_pm_005:
    message: "Permission rule at index %{index} has unknown field(s) %{fields}; %{consequence}"
    suggestion: "A permission rule takes only capability, effect, match and exclude."
  kr_pm_006:
    not_array: "Kiro permissions 'policies' must be an array of preset id strings; Kiro rejects the whole file and fails closed, denying all tool calls"
    unknown: "Kiro permissions preset '%{policy}' is unknown and skipped"
    admin: "Kiro permissions preset '%{policy}' contains allow rules, which an administrator policy cannot hold; Kiro skips them"
    suggestion: "Use preset ids allow-all, edit-workspace, read-workspace, read-all, read-only-shell or dev-shell."
  kr_pm_007:
    message: "Permission rule at index %{index}: %{field} pattern %{reason}"
    mcp_at: "'%{pattern}' never matches; MCP permission resources are server/tool without '@' (use '%{fixed}')"
    web_fetch_url: "'%{pattern}' never matches; web_fetch rules are compared with the URL host name (for example docs.example.com or *.example.com)"
    no_resource: "'%{pattern}' never matches; %{capability} requests have no resource to compare, so only '*' (or no match) applies"
    protected_path: "'%{pattern}' has no effect for an allow rule; Kiro always asks before (or denies) agent writes to .git, .vscode, .kiroignore, *.code-workspace and the .kiro agents, hooks, workflows, powers and settings directories"
    suggestion: "Rewrite the pattern in the form Kiro compares for this capability; see kiro.dev/docs/permissions."
  kr_pm_008:
    message: "Permission rule at index %{index} has match: [], which Kiro treats like an omitted match: the %{effect} rule applies to every %{capability} resource"
    suggestion: "List the resources the rule should cover, or omit match to make the full scope explicit."
  kr_pm_009:
    message: "Kiro does not read permission policies from this location; it reads ~/.kiro/settings/permissions.yaml (user) and ~/.kiro/workspace-roots/<hash>/permissions.yaml (workspace), so these rules are not applied"
    admin: "Kiro reads an administrator policy only from the operating-system managed-settings.json path (/Library/Application Support/Kiro/, /etc/kiro/ or C:\\ProgramData\\Kiro\\), so these rules are not applied from here"
    suggestion: "Install the policy in a location Kiro reads (copy it to ~/.kiro/settings/permissions.yaml, or let Kiro write workspace rules to ~/.kiro/workspace-roots), or keep this file only as a template."
    shadowed: "Kiro ignores this permissions.json because permissions.yaml exists in the same directory and is read instead"
    shadowed_suggestion: "Merge the rules into permissions.yaml and remove permissions.json."
  kr_pm_common:
    fatal: "Kiro rejects the whole file and fails closed, denying all tool calls until it is fixed"
    latent: "Kiro already skips this rule for its unknown capability, and will reject the whole file and fail closed once the capability is fixed"
  kr_pm_010:
    message: "Permission rule at index %{index} allows %{capability} with no match restriction and no exclude; Kiro advises specific patterns over wildcards and allowing only what the agent needs"
    suggestion: "List the commands, paths or servers to allow, or add exclude patterns for dangerous ones."
  kr_pm_011:
    message: "Permission rule at index %{index}: pattern '%{pattern}' uses %{syntax}, which Kiro does not support for %{capability} patterns (only * is a wildcard; ** acts as *, ? and [...] match literally)"
    suggestion: "Use * as the only wildcard in shell, web and MCP patterns."
  kr_pm_012:
    message: "Permission rule at index %{index} denies '%{host}', but sandbox_network rules are first-match and the earlier allow rule at index %{allow} already matches it, so this deny never applies"
    suggestion: "Move the specific deny before the broader allow."
  oc_dep_005:
    cleanup_suggestion: "Move '%{key}' to tui.json first. Only use the unsafe cleanup after migration is complete; it deletes legacy TUI settings without moving them."
    cleanup_fix: "Remove legacy TUI settings only after migration to tui.json is complete (does not move configuration)"
  oc_dep_002:
    migration_suggestion: "Migrate tools boolean values to permission actions/rules; do not only rename the key. Legacy tools remains supported."
  cop_027:
    message: "Field 'infer' is retired on GitHub.com and deprecated in VS Code; use 'disable-model-invocation' and 'user-invocable' instead"
    suggestion: "Replace 'infer' with 'disable-model-invocation' (the inverse of infer) and 'user-invocable'."
    fix: "Replace infer with invocation controls, preserving explicit fields"
  boolean_unwrap:
    json_fix: "Convert quoted %{value} to a JSON boolean (may change behavior or security policy)"
    yaml_fix: "Convert quoted %{value} to a YAML boolean (may change behavior or security policy)"
  as_001:
    message: SKILL.md must have YAML frontmatter between --- markers
    suggestion: Add frontmatter between --- markers
  as_002:
    message: Skill frontmatter is missing required 'name' field
    suggestion: 'Add ''name: your-skill-name'' to frontmatter'
  as_003:
    message: Skill frontmatter is missing required 'description' field
    suggestion: 'Add ''description: Use when...'' to frontmatter'
  as_004:
    message: Name '%{name}' must be 1-64 characters per segment using lowercase letters, digits, and hyphens, as a bare skill name or plugin:skill-name
    suggestion: Lowercase and trim each name segment, replace spaces and '_' with '-', collapse multiple '-' into one, remove invalid
      characters, and truncate each segment to 64 characters
    fix: 'Convert name to kebab-case: ''%{name}'''
  as_005:
    message: Name '%{name}' cannot start or end with hyphen
    suggestion: Remove leading/trailing hyphens from the name
  as_006:
    message: Name '%{name}' cannot contain consecutive hyphens
    suggestion: Replace '--' with '-' in the name
  as_008:
    message: Description must be 1-%{max} characters, got %{len}
    suggestion: Trim the description to %{max} characters or fewer
  as_009:
    message: Description must not contain XML tags
    suggestion: Remove XML tags from the description
  as_011:
    message: Compatibility must be 1-500 characters, got %{len}
    suggestion: Trim compatibility to 500 characters or fewer
  as_012:
    message: Skill content exceeds 500 lines (got %{count})
    suggestion: Move extra content into references/
  as_013:
    message: File reference '%{path}' is deeper than one level
    suggestion: Flatten the references/ directory structure
  as_015:
    message: Skill directory exceeds the Claude API 30MB upload limit (%{size} bytes); local Claude Code has no documented size limit
    suggestion: Remove large assets or split the skill into smaller parts
  as_016:
    message: 'Failed to parse SKILL.md: %{error}'
    suggestion: Check YAML frontmatter syntax -- ensure proper indentation, colon spacing, and matching quotes
  as_017:
    message: Skill name '%{name}' must match parent directory '%{directory}'
    suggestion: Rename the skill directory or update the name field so they match
  cc_sk_001:
    message: 'Invalid model ''%{model}''. Must be one of: %{valid}'
    suggestion: 'Use one of the valid model values: %{valid}'
  cc_sk_002:
    message: Invalid context '%{context}'. Must be 'fork' or omitted
    suggestion: Set context to 'fork' or remove the field entirely
  cc_sk_004:
    message: 'Agent field requires ''context: fork'''
    suggestion: 'Add ''context: fork'' to the frontmatter'
  cc_sk_005:
    message: Invalid agent type '%{agent}'. Must be Explore, Plan, general-purpose, or a custom kebab-case name (1-64 chars)
    suggestion: Use a built-in agent (Explore, Plan, general-purpose) or a custom kebab-case name
    fix: Replace invalid agent with 'general-purpose'
  cc_sk_006:
    message: 'Skill ''%{name}'' looks like a workflow with side effects, but Claude may invoke it on its own; set ''disable-model-invocation: true'' to run it only when you type /%{name}'
    suggestion: 'Add ''disable-model-invocation: true'' to the frontmatter'
  cc_sk_007:
    message: Unrestricted Bash access detected. Consider using scoped version for better security.
    suggestion: Use scoped Bash like 'Bash(git:*)' or 'Bash(npm:*)' instead of plain 'Bash'
    fix: Replace unrestricted Bash with scoped Bash(git:*)
  cc_sk_008:
    message: 'Unknown tool ''%{tool}''. Known tools: %{known}. MCP tools must use lowercase mcp__<server> or mcp__<server>__<tool>
      format'
    suggestion: 'Use one of the known Claude Code tools: %{known}, or a valid MCP tool (mcp__<server> or mcp__<server>__<tool>,
      case-sensitive lowercase prefix, no glob in the server segment)'
  cc_sk_009:
    message: Too many dynamic injections (%{count}). Limit to %{max} for better performance
    suggestion: Consider moving complex logic to a scripts/ directory or reducing injections
  cc_sk_010:
    message: 'Invalid hooks configuration in skill frontmatter: %{error}'
    suggestion: Ensure hooks follow the same schema as settings.json hooks
  cc_sk_012:
    message: argument-hint is set but body does not reference $ARGUMENTS
    suggestion: Add $ARGUMENTS to the skill body or remove the argument-hint field
  cc_sk_013:
    message: 'context: fork with reference-only content lacks actionable instructions'
    suggestion: Add imperative instructions for the forked agent to follow
  cc_sk_014:
    message: disable-model-invocation has invalid boolean value %{value}
    suggestion: Use true/false, yes/no, on/off, or 1/0 (quoted or unquoted)
  cc_sk_015:
    message: user-invocable has invalid boolean value %{value}
    suggestion: Use true/false, yes/no, on/off, or 1/0 (quoted or unquoted)
  cc_sk_016:
    message: Body uses indexed $ARGUMENTS[n] but argument-hint is missing
    suggestion: Add argument-hint to frontmatter so the / menu shows which arguments to type (agnix suggestion; the field is an autocomplete hint)
  cc_sk_017:
    message: Unknown frontmatter field '%{field}'
    suggestion: Remove unsupported fields or fix typos in frontmatter keys
  cr_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  cl_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  cp_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  cx_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  oc_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  ws_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  kr_sk_001:
    message: "Kiro ignores skill frontmatter field '%{field}' (a field other skill clients act on), so it has no effect in Kiro"
    suggestion: "Kiro reads only name, description, license, compatibility and metadata; remove '%{field}', or move it under metadata if no other tool needs it"
  kr_sk_001_tools:
    message: "Kiro ignores skill frontmatter field '%{field}', so this skill does not restrict tools in Kiro"
    suggestion: "Restrict tools with the Kiro agent's tools and permissions settings; remove '%{field}' if no other tool needs it"
  kr_sk_001_data:
    message: "Kiro ignores skill frontmatter field '%{field}'; it reads only name, description, license, compatibility and metadata"
    suggestion: "Move '%{field}' under metadata, where Kiro skills keep extra data such as author or version"
  kr_sk_002:
    message: "Skill description '%{description}' is too vague for Kiro to match requests against"
    suggestion: "Describe what the skill does and when to use it, with specific keywords and actions (e.g. 'Review pull requests for security vulnerabilities and test coverage. Use when reviewing PRs.')"
  amp_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  rc_sk_001:
    message: field '%{field}' is not supported by %{client} -- it will be ignored
    suggestion: Remove '%{field}' or move this skill to a client that supports it
  xp_sk_001:
    message: skill uses client-specific field '%{field}' which is not part of the universal Agent Skills spec
    suggestion: Consider removing '%{field}' for cross-platform portability
  xp_sk_002:
    message: Hardcoded user directory path '%{path}' leaks author identity and is not portable across machines
    suggestion: Use a path relative to the skill root, '~/', '$HOME/', or an env var. For shebangs prefer '#!/usr/bin/env
      <interpreter>'.
  cc_hk_001:
    message: 'Invalid hook event ''%{event}'', valid events: %{valid}'
    fix: Replace '%{old}' with '%{new}'
  cc_hk_002:
    message: '%{hook_type} hook at %{location} is not supported on ''%{event}'' events'
    suggestion: 'Use a supported event for this %{hook_type} hook, or use ''type'': ''command'' instead'
  cc_hk_003:
    message: Tool event '%{event}' at %{location} has no matcher field; omitting it matches all tools
    suggestion: Consider adding a 'matcher' field to target specific tools (e.g., 'Bash', 'Read')
  cc_hk_004:
    message: Non-tool event '%{event}' at %{location} must not have a matcher field
    suggestion: Remove the 'matcher' field
  cc_hk_005:
    message: Hook at %{location} is missing required 'type' field
    suggestion: 'Add ''type'': ''command'', ''type'': ''prompt'', or ''type'': ''agent'''
  cc_hk_006:
    message: Command hook at %{location} is missing required 'command' field
    suggestion: Add a 'command' field with the command to execute
  cc_hk_007:
    message: Prompt/agent hook at %{location} is missing required 'prompt' field
    suggestion: Add a 'prompt' field with the prompt text
  cc_hk_008:
    message: Script file not found at '%{script}' (resolved to '%{resolved}')
    suggestion: Create the script file or correct the path
  cc_hk_009:
    message: 'Potentially dangerous command pattern detected: %{reason}'
    suggestion: 'Review the command for safety. Pattern matched: %{pattern}'
  cc_hk_010:
    message: Hook at %{location} sets timeout %{timeout}s on SessionEnd, but SessionEnd hooks share a budget that settings raise to at most 60 seconds
    suggestion: Keep SessionEnd work under 60 seconds, or set CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS when it needs longer
    plugin_message: Plugin SessionEnd hook at %{location} sets timeout %{timeout}s, but timeouts on plugin-provided hooks don't raise the 1.5-second SessionEnd budget
    plugin_suggestion: Keep plugin SessionEnd work under 1.5 seconds; a user can raise the budget with CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS or a timeout in their own settings
  cc_hk_011:
    message: 'Invalid timeout value at %{location}: must be a positive integer'
    suggestion: Set timeout to a positive integer like 30
  cc_hk_012:
    message: 'Failed to parse hooks configuration: %{error}'
    suggestion: Validate JSON syntax in hooks configuration -- check for missing commas, brackets, or unquoted keys
  cc_hk_013:
    message: async field is only valid on command hooks, not %{hook_type} hooks at %{location}
    suggestion: Remove the async field or change the hook type to command
    fix: Remove 'async' field (has no effect on non-command hooks)
  cc_hk_014:
    message: once field at %{location} is only meaningful in skill frontmatter hooks
    suggestion: Remove the once field from hooks outside skill frontmatter
  cc_hk_015:
    message: model field is only valid on prompt/agent hooks, not command hooks at %{location}
    suggestion: Remove the model field or change the hook type to prompt/agent
    fix: Remove 'model' field (has no effect on command hooks)
  cc_hk_016:
    message: Unknown hook type '%{hook_type}' at %{location}
    suggestion: 'Valid hook types are: command, http, mcp_tool, prompt, agent'
    fix: Change hook type to '%{fixed}'
  cc_hk_018:
    message: Matcher at %{location} is silently ignored for '%{event}' events
    suggestion: Remove the matcher field as it has no effect on %{event} events
    fix: Remove 'matcher' field (ignored on %{event} events)
  mcp_001:
    invalid_version: Invalid JSON-RPC version '%{version}', must be '2.0'
    not_string: JSON-RPC version must be a string
    suggestion: 'Set "jsonrpc": "2.0"'
  mcp_002:
    missing_name: '%{prefix}Missing required field ''name'''
    missing_name_suggestion: Add 'name' field to tool definition
    missing_description: '%{prefix}Missing required field ''description'''
    missing_description_suggestion: Add 'description' field to tool definition
    missing_schema: '%{prefix}Missing required field ''inputSchema'''
    missing_schema_suggestion: Add 'inputSchema' field with JSON Schema definition
  mcp_003:
    message: '%{prefix}Invalid inputSchema: %{error}'
    suggestion: 'Fix JSON Schema structure -- valid ''type'' values are: string, number, integer, boolean, object, array,
      null'
  mcp_004:
    message: '%{prefix}Tool description is too short (%{len} chars), should be at least 10 characters'
    suggestion: Add a meaningful description explaining what the tool does
  mcp_005:
    message: '%{prefix}Tool lacks consent mechanism (no ''requiresApproval'' or ''confirmation'' field)'
    suggestion: 'Consider adding ''requiresApproval: true'' for tools that modify data or have side effects'
  mcp_006:
    message: '%{prefix}Tool has annotations that should be validated before trusting'
    suggestion: Verify annotation values independently -- annotations are self-reported by the server and may be inaccurate
      or malicious
  mcp_007:
    message: 'Failed to parse MCP configuration: %{error}'
    suggestion: Validate JSON syntax -- check for missing commas, brackets, or unquoted keys
  mcp_008:
    message: 'Protocol version mismatch: found ''%{found}'', expected ''%{expected}'''
    request_suggestion: Consider updating to protocol version '%{expected}' for compatibility
    response_suggestion: Server negotiated version '%{found}', expected '%{expected}'. Verify compatibility.
    assumption: Using default MCP protocol version. Pin mcp_protocol in .agnix.toml [spec_revisions] for explicit control.
  mcp_009:
    message: Server '%{server}' has type 'stdio' but is missing required 'command' field
    suggestion: Add a 'command' field specifying the executable to run
  mcp_010:
    message: Server '%{server}' has type '%{server_type}' but is missing required 'url' field
    suggestion: Add a 'url' field specifying the server endpoint
  mcp_011:
    message: Server '%{server}' has invalid type '%{server_type}'. Must be 'stdio', 'http', or 'sse'
    suggestion: 'Use one of: stdio, http, sse'
    fix: Change server type to '%{fixed}'
  mcp_012:
    message: Server '%{server}' uses deprecated SSE transport
    suggestion: Consider changing type from 'sse' to 'http' (Streamable HTTP)
    fix: Change type from 'sse' to 'http'
  invalid_tool: 'Tool #%{num}: Invalid tool definition: %{error}'
  invalid_tool_single: 'Invalid tool definition: %{error}'
  invalid_tool_suggestion: 'Ensure tool has valid field types (name: string, description: string, inputSchema: object)'
  cc_ag_001:
    message: Agent frontmatter has no 'name' field, so Claude Code treats the file as documentation and doesn't load it as a subagent
    suggestion: 'Add ''name: your-agent-name'' to frontmatter'
  cc_ag_002:
    message: Agent frontmatter is missing required 'description' field
    suggestion: 'Add ''description: Describe what this agent does'' to frontmatter'
  cc_ag_003:
    message: 'Invalid model ''%{model}''. Valid values: %{valid}'
    suggestion: 'Change model to one of: %{valid}'
  cc_ag_004:
    message: 'Invalid permissionMode ''%{mode}''. Valid values: %{valid}'
    suggestion: 'Change permissionMode to one of: %{valid}'
  cc_ag_005:
    message: Referenced skill '%{skill}' not found in project or user skills; an enabled plugin may supply it
    suggestion: Check enabled plugin skills or add the skill in the project or user skill directory
    too_many: 'skills lists %{count} distinct skills; Claude Code preloads only the first 32, so these are skipped: %{skipped}'
    too_many_suggestion: Preload at most 32 skills; the subagent can still invoke the others through the Skill tool
    not_preloadable: Skill '%{skill}' sets disable-model-invocation, so Claude Code can't preload it into this subagent
    not_preloadable_suggestion: Remove the skill from 'skills', or drop disable-model-invocation from the skill if it may be preloaded
  cc_ag_006:
    message: 'Tool(s) appear in both ''tools'' and ''disallowedTools'': %{conflicts}'
    suggestion: Claude Code removes overlapping tools; remove a redundant entry if unintended
  cc_ag_007:
    message: File in an agents directory has no frontmatter on its first line, so Claude Code treats it as documentation, not a subagent
    suggestion: To make it a subagent, start the file with --- frontmatter that sets name and description; otherwise no change is needed
    parse_error: 'Failed to parse agent frontmatter: %{error}'
    parse_error_suggestion: Check YAML frontmatter syntax -- ensure proper indentation, colon spacing, and matching quotes
  cc_ag_008:
    message: Invalid memory scope '%{scope}'. Must be 'user', 'project', or 'local'
    suggestion: 'Use one of: user, project, local'
    fix: Change memory scope to '%{fixed}'
  cc_ag_009:
    message: 'Unknown tool ''%{tool}'' in tools list. Known tools: %{known}. MCP tools must use lowercase mcp__<server> or
      mcp__<server>__<tool> format'
    suggestion: Use a known Claude Code tool name or a valid MCP tool (mcp__<server> or mcp__<server>__<tool>, case-sensitive
      lowercase prefix, no glob in the server segment)
  cc_ag_010:
    message: 'Unknown tool ''%{tool}'' in disallowedTools list. Known tools: %{known}'
    suggestion: Use a known Claude Code tool name or a valid MCP tool (mcp__<server> or mcp__<server>__<tool>, case-sensitive
      lowercase prefix, no glob in the server segment)
  cc_ag_011:
    message: 'Invalid hooks configuration in agent frontmatter: %{error}'
    suggestion: Ensure hooks follow the same schema as settings.json hooks
  cc_ag_012:
    message: permissionMode 'bypassPermissions' is restricted to an already-bypassing parent in Claude Code 2.1.267 or later; review older versions separately
    suggestion: Review the parent permission mode and pinned Claude Code version before enabling bypassPermissions
    fix: Replace 'bypassPermissions' with 'default'
  cc_ag_019:
    unknown: Unknown agent frontmatter field '%{field}'; Claude Code ignores fields it doesn't recognize
    unknown_suggestion: 'Remove or rename ''%{field}'' - known fields: %{known}'
    cache_ttl_suggestion: Write cacheTtl inside the experimental map (experimental.cacheTtl), not at the top level
    auto_compact_window: autoCompactWindow %{value} is ignored; Claude Code accepts a plain integer token count from 100000 to 1000000
    auto_compact_window_suggestion: Write the value as a plain integer such as 200000 (in frontmatter '200k' reads as 200)
  cc_ag_021:
    message: The project's subagent descriptions add up to about %{tokens} tokens across %{count} files, over the %{budget}-token total that makes Claude Code show a startup warning
    suggestion: Trim the description fields and move detail into each subagent's body, which loads only when that subagent runs
  cc_ag_022:
    message: This subagent sets neither tools nor disallowedTools, so it inherits every tool available to subagents
    suggestion: List only the tools it needs in 'tools', or remove the risky ones with 'disallowedTools'
  cc_ag_023:
    message: 'Subagent name ''%{name}'' is also declared in %{others}; Claude Code loads only one of them, chosen by filesystem read order'
    suggestion: Give each subagent in the .claude/agents tree a unique name
  cc_ag_024:
    disallowed_specifier: disallowedTools entry '%{entry}' removes the whole %{tool} tool from this subagent, not only the matching calls
    disallowed_specifier_suggestion: To keep the tool and block only those calls, add '%{entry}' to permissions.deny in settings instead
    agent_type_list: tools entry '%{entry}' limits spawnable agent types only when this agent runs as the main thread with claude --agent; as a subagent the type list is ignored
    agent_type_list_suggestion: If this file is used as a subagent, write 'Agent' without a type list
  cc_pl_014:
    message: Plugin agent sets '%{field}', which Claude Code ignores for agents in plugin '%{plugin}'
    suggestion_remove: Remove '%{field}' from the plugin agent; it has no effect there
    suggestion_plugin_level: Remove '%{field}' and declare it at plugin level (hooks/hooks.json or the plugin's MCP servers)
  cc_ag_020:
    message: "Local agent name '%{name}' starts with '-', contains ':', or exceeds 256 characters"
    suggestion: "Use a name of at most 256 characters without a leading '-' or ':'"
  cc_mem_004:
    message: npm script '%{script}' not found in package.json
    suggestion_no_scripts: No scripts defined in package.json.
    suggestion_available: 'Available scripts: %{scripts}'
  cc_mem_005:
    message: Generic instruction '%{text}' - Claude already knows this
    suggestion: Remove generic instructions. Focus on project-specific context.
    fix: Remove generic instruction line
  cc_mem_006:
    message: Negative instruction '%{text}' without positive alternative
    suggestion: 'Add a positive alternative: ''Instead, do...'' or ''Use X instead.'''
  cc_mem_008:
    message: Critical keyword '%{keyword}' at %{percent} percent of document (middle zone)
    suggestion: Move critical content to the top or bottom of the document for better recall.
  cc_mem_010:
