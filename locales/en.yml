  gm_ag_002:
    no_frontmatter: 'Gemini agent file does not start with YAML frontmatter enclosed in ---, so the agent loader rejects it'
    yaml_error: 'Gemini agent frontmatter is not valid YAML (%{error}); the agent loader rejects the file'
    yaml_tag: "Gemini agent frontmatter uses the YAML tag '%{tag}', which the agent loader's YAML parser (js-yaml) rejects as an unknown tag; quote the value (for example \"!command ...\" for a dynamic auth value)"
    not_mapping: 'Gemini agent frontmatter must be a mapping of agent fields (or a list of remote agents), found %{found}'
    missing: "Gemini agent '%{field}' is missing or empty; the agent loader requires it"
    not_string: "Gemini agent '%{field}' must be a string, found %{found}"
    not_list: "Gemini agent '%{field}' must be a list, found %{found}"
    tools_not_strings: Gemini agent tools must be a list of tool name strings
    bad_name: "Gemini agent name '%{name}' is not a valid slug: only lowercase letters, numbers, hyphens and underscores are allowed"
    bad_kind: "Gemini agent kind '%{value}' must be local or remote"
    list_local: 'A list of agents in one file must hold remote agents only ("the list format is currently remote-only")'
    no_agent_card: "Remote Gemini agent '%{name}' needs agent_card_url or agent_card_json"
    both_agent_cards: "Remote Gemini agent '%{name}' sets both agent_card_url and agent_card_json; the loader accepts only one"
