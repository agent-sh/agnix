    invalid_type: 'hooks[%{index}] action.type "%{kind}" is not "command" or "agent"; Kiro skips the whole file'
    invalid_type_fix: 'Replace action.type with "%{kind}" (activates the hooks in this file)'
    command_required: 'hooks[%{index}] command action has no "command"; Kiro skips the whole file'
    prompt_required: 'hooks[%{index}] agent action has no "prompt"; Kiro skips the whole file'
    payload_empty: 'hooks[%{index}] action.%{field} is empty; Kiro skips the whole file'
    payload_type: 'hooks[%{index}] action.%{field} is %{found}, not a string; Kiro skips the whole file'
    payload_blank: 'hooks[%{index}] action.%{field} contains only whitespace, so the hook does nothing'
  kr_hk_009:
    message: Kiro hook command uses an absolute path
    suggestion: Use a relative path or a tool on PATH to keep hooks portable across machines
  kr_hk_010:
    message: Potential hardcoded secret detected in Kiro hook command
    suggestion: Remove hardcoded credentials from the hook command; reference environment variables (e.g. ${API_KEY}) instead
  kr_hk_015:
    document: 'Legacy Kiro IDE hook format (when/then) in a .json hook file: Kiro CLI V3 and IDE 1.0 read .kiro/hooks/*.json only as v1 hook files and skip this file'
    entry: 'hooks[%{index}] uses the legacy IDE when/then fields instead of trigger and action; Kiro skips the whole file'
    suggestion: 'Rename the file to .kiro.hook to keep it as a legacy IDE hook (IDE 1.0 offers to upgrade it), or convert it to a v1 hook file: when.type becomes trigger (for example fileEdited becomes PostFileSave), when.patterns becomes a regex matcher, and then becomes action {"type": "command" or "agent"}'
  kr_hk_016:
    message: 'v1 hook format in a .kiro.hook file: Kiro loads v1 hooks only from .kiro/hooks/*.json, so these hooks never run'
    suggestion: Rename the file so it ends in .json
  kr_hk_017:
    field_type: 'hooks[%{index}] "%{field}" is %{found}, expected %{expected}; Kiro skips the whole file'
    timeout_fraction: 'hooks[%{index}] timeout %{value} is not a whole number of seconds; Kiro skips the whole file'
    timeout_negative: 'hooks[%{index}] timeout %{value} is negative; Kiro skips the whole file'
    suggestion: 'timeout is a whole number of seconds (default 60, 0 disables it), enabled is true or false, and matcher and description are strings'
    fix: 'Replace the quoted value with %{value} (activates the hooks in this file)'
  kr_hk_018:
    confirm_type: 'hooks[%{index}] "confirm" is %{found}, not an object; Kiro skips the whole file'
    missing_field: 'hooks[%{index}] confirm has no "%{field}"; Kiro skips the whole file'
    empty_field: 'hooks[%{index}] confirm.%{field} is empty; Kiro skips the whole file'
    field_type: 'hooks[%{index}] confirm.%{field} is %{found}, expected %{expected}; Kiro skips the whole file'
    empty_options: 'hooks[%{index}] confirm.options is empty; Kiro skips the whole file'
    suggestion: 'confirm needs a non-empty question and at least one option {"id": "...", "label": "...", "run": true or false}; confirmCommand is an optional non-empty string'
    no_effect: 'hooks[%{index}] confirm is ignored: Kiro asks for confirmation only before Stop hooks with a command action'
    no_effect_suggestion: Remove confirm, or use it on a Stop hook whose action is a command
  kr_hk_019:
    message: 'hooks[%{index}] matcher "%{matcher}" is not a valid regular expression (%{error}); Kiro never runs this hook'
    suggestion: 'Matchers are JavaScript regular expressions, not globs: write \.ts$ rather than *.ts, and (^|/)src/ rather than src/**. Tool matchers may also be plain selectors such as shell, @mcp or fs_*.'
  kr_hk_020:
    message: 'hooks[%{index}] matcher has no effect for %{trigger}; the hook runs on every %{trigger} event'
    suggestion: Remove the matcher, or filter inside the command. Only PreToolUse, PostToolUse, PostFileCreate, PostFileSave and PostFileDelete use a matcher.
  kr_hk_021:
    message: 'hooks[%{index}] matcher "%{matcher}" matches no Kiro V3 built-in tool: %{names}'
    name: '%{name} is a %{origin} tool name (V3: %{replacement})'
    suggestion: 'Kiro V3 matches tool ids such as read_file, fs_write and execute_bash, or tags such as read, write and shell; MCP tools are mcp_<server>_<tool> or @<server>'
  kr_hk_022:
    misspelled: 'hooks[%{index}] key "%{key}" is ignored because keys are case-sensitive (did you mean "%{expected}"?)'
    v2_timeout: 'hooks[%{index}] "%{key}" is a Kiro CLI 2.x field that V3 ignores; this hook uses the default 60 second timeout'
    action_timeout: 'hooks[%{index}] action.timeout is ignored because timeout belongs on the hook, next to action; this hook uses the default 60 second timeout'
    legacy_filter: 'hooks[%{index}] "%{key}" is an IDE 0.x field that V3 ignores; without a matcher the hook runs on every event'
    belongs_in_action: 'hooks[%{index}] "%{key}" is ignored at the hook level; it belongs inside action'
    suggestion: Kiro V3 drops unknown hook keys silently. Move or rename the key (timeout is in seconds on the hook object).
  kr_hk_023:
    template: 'hooks[%{index}] %{field} uses %{placeholder}, which Kiro V3 does not substitute; the shell receives it literally'
    env: 'hooks[%{index}] %{field} reads $%{variable}, which Kiro V3 does not set, so it expands to an empty string'
    workspace_root: 'hooks[%{index}] %{field} uses $WORKSPACE_ROOT; Kiro substitutes only ${WORKSPACE_ROOT}, and the shell expands $WORKSPACE_ROOT to an empty string'
    confirm_workspace_root: 'hooks[%{index}] confirm.confirmCommand uses ${WORKSPACE_ROOT}, which Kiro substitutes only in action.command, so it expands to an empty string'
    suggestion: 'Kiro V3 passes event data (file_path, tool_name, tool_input, prompt) as JSON on stdin, for example jq -r .file_path. It substitutes only ${WORKSPACE_ROOT} in action.command and $HOME in confirmCommand.'
  kr_hk_024:
    session_end_agent: 'hooks[%{index}] SessionEnd runs only command actions, so this agent action never runs'
    session_end_suggestion: Use a command action, or use Stop for work after every turn
    manual: 'hooks[%{index}] is a Manual hook: Kiro CLI V3 lists it but cannot run it (/hooks has no run action)'
    manual_suggestion: 'Start it from the IDE Agent Hooks panel; for an on-demand workflow in the CLI, use a steering file with inclusion: manual (it runs as a /<name> slash command)'
  kr_hk_025:
    message: 'Kiro CLI 2.x ([tool_versions] kiro = "%{version}") does not load .kiro/hooks/*.json; these hooks run only in the V3 engine (kiro-cli --v3, the default from CLI 3.0) and in Kiro IDE 1.0'
    suggestion: To run hooks in CLI 2.x, define them in an agent's hooks field; keep this file for V3 and the IDE
  kr_hk_026:
    parse_error: 'Kiro IDE hook file is not valid JSON: %{error}'
    root_type: 'Kiro IDE hook file must be a JSON object (found %{found})'
    field_type: 'Kiro IDE hook field %{field} is %{found}, expected %{expected}'
    negative_timeout: 'Kiro IDE hook field %{field} is negative; the timeout is in seconds and 0 disables it'
    suggestion: 'An IDE 0.x hook is {"name": "...", "when": {"type": "...", "patterns": [...]}, "then": {"type": "askAgent" or "runCommand", "prompt" or "command": "...", "timeout": seconds}}'
  kr_hk_027:
    message: 'hooks[%{index}] %{trigger} hook has no specific matcher, so it runs on every tool call'
    suggestion: 'Target specific tools or tags, for example shell, write, @github or ^fs_write$; Kiro recommends precise matchers over "*"'
  kr_hk_028:
    message: 'hooks[%{index}] %{trigger} hook has no specific matcher, so it runs on every file the agent changes'
    legacy: "Kiro '%{event}' hook patterns match every file"
    suggestion: 'Kiro recommends specific file patterns, for example \.ts$ (V3 matcher regex) or src/**/*.ts (IDE 0.x patterns)'
  kr_hk_029:
    message: 'hooks[%{index}] matcher "%{matcher}" is an unanchored regex, so it also matches tool ids that only contain these names'
    suggestion: 'Anchor the regex as ^(...)$ to match exact tool ids, unless substring matching is intended'
  kr_hk_030:
    message: 'Hook file name "%{name}" is not kebab-case'
    suggestion: 'Kiro suggests descriptive kebab-case names such as lint-on-save.json or guard-writes.json'
  cc_sk_021:
    message: Hardcoded user directory path '%{path}' leaks author identity and is not portable across machines
    suggestion: Replace with '~/', '$HOME/', a project-relative path, or an env var like '$PROJECT_ROOT'. For shebangs prefer
      '#!/usr/bin/env <interpreter>'.
  cc_sk_022:
    message: Claude Code skips local skill '%{name}' because its name is reserved
    suggestion: Rename the skill folder or frontmatter name outside the reserved synced and anthropic-skills names.
  cc_sk_023:
    message: '%{token} inside code is replaced by $ARGUMENTS[%{index}] when the skill is invoked with arguments'
    suggestion: 'If %{token} is shell, awk or other code syntax, escape it as \%{token}. If it should receive an argument, add an argument-hint.'
  cc_sk_024:
    message: Skill has no description or when_to_use, so Claude Code uses the first non-empty body line to decide when to load it
    suggestion: Add a description that says what the skill does and when to use it
  cc_sk_025:
    message: Skills in this .claude/skills directory use about %{chars} characters of names and descriptions across %{count} skills, over the %{budget} characters agnix estimates for Claude Code's listing budget (1% of a 200,000-token context window)
    suggestion: Shorten descriptions and put the key use case first; over budget, Claude Code drops descriptions from the listing
  cc_sk_027:
    message: Legacy custom command file; Claude Code still loads .claude/commands files, but skills are the current format
    ignored_fields: Legacy custom command file sets %{fields}, which have no effect in .claude/commands files; skills are the current format and support them
    suggestion: Move it to .claude/skills/%{name}/SKILL.md when convenient; the command keeps the same /%{name} name
  cc_sk_028:
    unrecognized: Injected command in '%{snippet}' is left as literal text and never runs; Claude Code recognizes !`...` only at the start of a line or after whitespace
    unrecognized_suggestion: Put whitespace before the ! or move the placeholder to the start of a line
    control_character: File contains a raw control character, so Claude Code runs none of its injected !`...` commands
    control_character_suggestion: Remove control characters other than tab and newline from the file
  cc_sk_030:
    message: Skill name '%{name}' contains the reserved word '%{word}', so claude.ai and the Claude API reject the skill on upload
    suggestion: Rename the skill if it may be uploaded; Claude Code itself still loads it
  cc_sk_031:
    message: Skill %{field} contains the XML tag '%{tag}', so claude.ai and the Claude API reject the skill on upload
    suggestion: Remove XML tags from the name and description if the skill may be uploaded
  cc_sk_032:
    message: Skill description starts with '%{opening}'; Anthropic's skill guidance says to write descriptions in the third person because they're injected into the system prompt
    suggestion: Describe the skill in the third person, such as 'Processes Excel files and generates reports'
  cc_sk_033:
    message: Skill name '%{name}' is too generic for Claude to tell when to use it
    suggestion: Use a specific name that says what the skill does, such as 'processing-pdfs' or 'analyzing-spreadsheets'
  cc_sk_034:
    message: Reference file has %{lines} lines and no table of contents near the top (Anthropic's skill guidance asks for one above %{threshold} lines)
    suggestion: Add a short contents list at the top so Claude can see the whole file's scope when it previews it
  cc_pl_020:
    message: Plugin content uses %{spelling}, which isn't set in the Bash tool's environment and isn't substituted without braces
    suggestion: Write %{braced} so Claude Code substitutes the path when it loads the content
  cln_005:
    message: Cline workflow file is empty
    message_no_content: "Cline workflow has no steps after the frontmatter; the Cline SDK loader rejects it"
    suggestion: Add workflow steps to the file
  cln_006:
    message: "Cline ignores frontmatter key '%{key}' in workflow files"
    suggestion: "Remove '%{key}'. Cline reads name, disabled and enabled in workflow frontmatter."
  cln_009:
    message: Unknown Cline hook event name '%{event}'
    suggestion: "Name the hook after a file hook event: TaskStart, TaskResume, UserPromptSubmit, PreToolUse, PostToolUse, TaskComplete, TaskError, TaskCancel or SessionShutdown"
    unwired: "%{event} is not wired for file hooks, so Cline never runs this script"
    unwired_suggestion: "Use a runtime hook in a Cline plugin, or one of the file hook events"
  cln_010:
    message: "Cline cannot parse this frontmatter (%{error}): the VS Code extension then loads the whole file for every request, and the CLI skips the file"
    suggestion: "Fix the YAML between the --- lines"
    alias_suggestion: "Quote glob patterns that start with *, for example - \"*.md\". YAML reads an unquoted *.md as an alias."
    unclosed: "Frontmatter has no closing --- line, so Cline reads no frontmatter: paths is ignored and the block becomes part of the rule text"
    unclosed_suggestion: "Close the frontmatter with a line that contains only ---"
  cln_011:
    items: "paths has an empty or non-string entry, so Cline ignores the condition and loads this rule for every request"
    not_array: "paths is %{got}, not an array, so Cline ignores the condition and loads this rule for every request"
    suggestion: "Make paths a list of quoted glob patterns, for example paths: [\"src/**/*.ts\"]. Use paths: [] to turn the rule off."
  cln_012:
    extension: "The VS Code extension does not run '%{file}': hooks there must be named exactly %{event}, with no file extension"
    extension_suggestion: "Rename the file to %{event}, or move it to .cline/hooks/ if only the Cline CLI uses it"
    shebang: "Hook '%{file}' has no shebang line, so the VS Code extension cannot run it"
    shebang_suggestion: "Start the script with a shebang such as #!/usr/bin/env bash, and make it executable"
  cln_013:
    message: "Cline is removing .clineignore, and it never blocked access to the files it lists"
    suggestion: "To keep the patterns, enforce them with the PreToolUse .clineignore guard hook or the Block Ignored File Access plugin"
  cln_014:
    message: "Possible literal secret in a Cline %{kind} file; these files are committed and sent to the model"
    suggestion: "Move the value to an environment variable and keep secrets out of the repo"
  cln_015:
    message: "Cline matches paths against workspace-relative paths, so '%{pattern}' never matches"
    suggestion: "Write the pattern relative to the workspace root, without a leading / or .. segments, for example src/**"
  cln_016:
    message: "Remote MCP server '%{server}' has no type, so Cline uses the legacy SSE transport"
    suggestion: "Set \"type\": \"streamableHttp\", or \"type\": \"sse\" if the server only supports SSE"
  cl_sk_004:
    message: "Cline skill has no instructions; the Cline SDK loader, used by the CLI, rejects it"
    suggestion: "Add the skill instructions below the frontmatter"
  gm_010:
    message: experimental.memoryManager is enabled without experimental.autoMemory (Gemini CLI v0.40+ split these flags)
    suggestion: 'Set experimental.autoMemory: true alongside memoryManager to keep background skill extraction and /memory
      inbox working after v0.40 (see https://github.com/google-gemini/gemini-cli/pull/25601)'
  oc_cfg_001:
    message: Invalid model format '%{value}'; expected 'provider/model-id' (e.g. 'anthropic/claude-sonnet-4-5')
    type_error: Field 'model' must be a string
    suggestion: Use 'provider/model-id' format — 'anthropic/claude-sonnet-4-5', 'openai/gpt-5', etc.
  oc_cfg_002:
    message: Invalid autoupdate value. Use boolean true/false or string 'notify'
    suggestion: Set autoupdate to true, false, or 'notify'
  oc_cfg_003:
    message: Unknown top-level config key '%{key}' in opencode.json
    suggestion: Remove unsupported top-level keys or verify spelling against OpenCode docs
  oc_cfg_005:
    message: Potential hardcoded API key detected in opencode.json
    suggestion: Replace plaintext keys with environment variable references ({env:ANTHROPIC_API_KEY}) or use opencode auth
      login
  oc_cfg_006:
    message: Invalid MCP server entry '%{server}' — each server must be an object
    type_error: Field 'mcp' must be an object mapping server names to server configs
    suggestion_type: Each server value must be an object (not a string, array, or primitive)
    suggestion: Shape each mcp server entry as an object with a 'type' and either 'command' or 'url'
  oc_cfg_007:
    local_missing: MCP server '%{server}' has type 'local' but no command
    remote_missing: MCP server '%{server}' has type 'remote' but no url
    suggestion_local: Add a 'command' array for local servers (e.g. command = ["npx", "my-server"])
    suggestion_remote: Add a 'url' for remote servers (e.g. url = "https://…")
    environment_type: Local MCP server 'environment' must be an object whose values are strings
    unsupported_env: Local MCP servers do not support 'env'; the field is ignored
    suggestion_environment: Rename 'env' to 'environment' and use string values for every variable
  oc_ag_001:
    message: 'Invalid OpenCode agent mode ''%{value}'' — valid modes: ''all'', ''read-only'', ''custom'''
    suggestion: Set mode to 'all' (default), 'read-only', or 'custom'
  oc_ag_002:
    message: Invalid color format '%{value}' — expected a hex color (#RRGGBB) or a named color
    suggestion: Use a hex color like '#FF5733' or one of the named colors (red, green, blue, yellow, purple, cyan)
  oc_pm_001:
    message: 'Invalid permission action ''%{value}'' for ''%{tool}''. Valid values: ''allow'', ''ask'', ''deny'''
    type_error: Permission values must be strings ('allow', 'ask', 'deny') or nested maps of those strings
    suggestion: Use only 'allow', 'ask', or 'deny' for permission action values
  cdx_cfg_028:
    message: MCP server '%{server}' uses unsupported inline 'bearer_token' field. Codex runtime rejects this - use 'bearer_token_env_var'
      to reference an env var instead
    suggestion: 'Replace ''bearer_token = "..."'' with ''bearer_token_env_var = "YOUR_ENV_VAR_NAME"'' and set the token in
      that env var. Rationale: openai/codex#19294 - the field was removed from the config schema in rust-v0.125.0'
  cdx_cfg_029:
    message: '''agents.%{field}'' must be a positive integer; Codex 0.145 uses this value as the per-session concurrent agent
      limit and rejects zero, negative, fractional, or non-numeric values'
    suggestion: 'Set ''agents.%{field}'' to an integer of 1 or greater. Codex 0.145 accepts both the current ''max_concurrent_threads_per_session''
      name and the legacy ''max_threads'' alias.'
  cdx_cfg_029_duplicate:
    message: '''agents.max_concurrent_threads_per_session'' and its ''agents.max_threads'' compatibility alias cannot both be set'
    suggestion: 'Remove one concurrency field; prefer ''agents.max_concurrent_threads_per_session'' for new configuration.'
  cc_hk_021:
    non_tool_event: 'Hook at %{location} sets ''if'' on ''%{event}'', so it never runs: ''if'' is evaluated only on tool events (%{events})'
    non_tool_event_suggestion: Remove the 'if' field, or move the handler to a tool event
    combined: 'Hook at %{location} combines rules in ''if'' with ''%{operator}''; ''if'' holds exactly one permission rule and has no &&, || or list syntax'
    combined_suggestion: Define a separate hook handler for each condition
    invalid: Hook at %{location} has an 'if' that is not a non-empty permission rule string
    invalid_suggestion: Set 'if' to one permission rule such as "Bash(git *)", or remove it
  cc_hk_025:
    case_message: Matcher '%{matcher}' at %{location} matches no tool because matchers are case-sensitive; the tool is '%{tool}'
    case_suggestion: Write the tool name as '%{tool}'
  cc_hk_029:
    invalid: 'Hook at %{location} has onFailure ''%{value}''; it accepts only "continue" or "block"'
    invalid_suggestion: Set onFailure to "block" to block the action when the hook fails, or "continue" to let it go ahead
    no_effect: 'onFailure at %{location} has no effect: %{reason}'
    no_effect_suggestion: Remove onFailure, or move the check to a hook where a failure can block
    version: it requires Claude Code v2.1.295 or later, and the pinned version is %{version}
    wrong_type: it applies only to command and http hooks, not %{hook_type} hooks
    non_blocking_event: exit code 2 on %{event} already sends Claude back to work, so a failed hook can't block it
    background: background hooks that set async or asyncRewake can't block
  cc_hk_030:
    message: Shell-form hook command at %{location} uses %{placeholder} outside double quotes, so a path with spaces splits into several words
    suggestion: Wrap the placeholder in double quotes, as in "%{placeholder}"/scripts/x.sh, or switch to exec form with "args"
    relative: Hook command at %{location} runs '%{script}' by a relative path; hooks run in Claude Code's current directory, which moves when Claude runs cd
    relative_suggestion: Reference the script as "%{anchor}"/... (in double quotes), or use exec form with the placeholder in "args"
  cc_hk_031:
    message: Exec-form hook at %{location} sets command '%{command}', which can't be spawned because in exec form command is only the executable
    suggestion: Put the executable in "command" and move the other words into "args"
    shell_ignored: Hook at %{location} sets 'shell' together with 'args'; shell is ignored in exec form
    shell_ignored_suggestion: Remove 'shell', or remove 'args' to run the command through that shell
  cc_hk_032:
    bare: PowerShell hook at %{location} uses %{placeholder}; PowerShell resolves that spelling to $null, which drops the path prefix
    single_quoted: PowerShell hook at %{location} puts %{placeholder} inside single quotes, where PowerShell never expands it
    suggestion: Write ${CLAUDE_PROJECT_DIR} or $env:CLAUDE_PROJECT_DIR, inside double quotes
  cc_hk_033:
    message: Matcher '%{matcher}' at %{location} is compared as an exact tool name, so it matches no MCP tool
    suggestion: Use '%{fixed}' to match every tool from that server
    fix: Change the matcher to '%{fixed}'
  cc_hk_034:
    matcher_message: Matcher '%{value}' at %{location} names the plugin's own MCP server '%{server}' by its bare key, so it never fires
    server_message: MCP tool hook at %{location} names the plugin's own server '%{server}' by its bare key
    if_message: '''if'' rule ''%{value}'' at %{location} names the plugin''s own MCP server ''%{server}'' by its bare key, so it never matches'
    suggestion: Tools from this plugin's servers are named %{scoped_tool}<tool>; an mcp_tool hook names the server as %{scoped_server}
  cc_hk_035:
    message: PermissionRequest hook at %{location} has matcher %{matcher}; a hook that allows here approves every permission prompt, including file writes and shell commands
    suggestion: Narrow the matcher to the tools the hook should approve, such as 'Bash' or 'Edit|Write'
  cc_hk_026:
    message: MCP tool hook at %{location} is missing required 'server' field
    suggestion: 'Add a ''server'' field naming an already-connected MCP server (e.g. "server": "my_server")'
  cc_hk_027:
    message: MCP tool hook at %{location} is missing required 'tool' field
    suggestion: 'Add a ''tool'' field naming the MCP tool to invoke (e.g. "tool": "security_scan")'
  gm_ag_001:
    not_object: 'MCP server ''%{server}'': ''auth'' block must be a mapping (type + fields)'
    missing_type: 'MCP server ''%{server}'': ''auth'' block is missing required ''type'' discriminator'
    invalid_type: 'MCP server ''%{server}'': ''auth.type'' is ''%{value}'', must be one of: %{valid}'
    unknown_field_google: 'MCP server ''%{server}'': auth.type is ''google-credentials'' - field ''%{field}'' is not supported
      for this variant (only ''scopes'' is)'
    unknown_field_oauth: 'MCP server ''%{server}'': auth.type is ''oauth'' - field ''%{field}'' is not part of the oauth schema'
    not_string: 'MCP server ''%{server}'': ''auth.%{field}'' must be a string'
    invalid_url: 'MCP server ''%{server}'': ''auth.%{field}'' is ''%{value}'', must be a valid http(s) URL'
    scopes_not_array: 'MCP server ''%{server}'': ''auth.scopes'' must be an array of strings'
    scope_not_string: 'MCP server ''%{server}'': ''auth.scopes[%{index}]'' must be a string'
    suggestion: 'Align the auth block with the schema documented at google-gemini/gemini-cli#24770. For google-credentials:
      {type: google-credentials, scopes?: [...]}. For oauth: {type: oauth, client_id?, client_secret?, scopes?, authorization_url?,
      token_url?}'
  kr_set_001:
    type_error: "toolSearch.enabled must be a boolean (true or false); Kiro does not read other values and keeps the default"
    suggestion: "Set toolSearch.enabled to true or false. Example: {\"toolSearch.enabled\": true}. See https://kiro.dev/docs/mcp/tool-search/"
  kr_set_002:
    type_error: "toolSearch.minPct must be a number (percentage of the context window); Kiro does not read other values and keeps the default"
    negative: "toolSearch.minPct must be non-negative (0 means 'always active')"
    over_100: "toolSearch.minPct is above 100%; Tool Search would never activate, and the V3 engine accepts only 0 to 100"
    suggestion: "Set toolSearch.minPct to a number from 0 to 100 (default 5). Use 0 to make Tool Search always active. See https://kiro.dev/docs/mcp/tool-search/"
  kr_set_003:
    type_error: "toolSearch.minTokens must be a number (token count threshold); Kiro does not read other values and keeps the default"
    negative: "toolSearch.minTokens must be non-negative (0 means 'always active')"
    not_integer: "toolSearch.minTokens must be an integer (token counts are whole numbers)"
    suggestion: "Set toolSearch.minTokens to a non-negative integer (default 50000). Use 0 to make Tool Search always active. See https://kiro.dev/docs/mcp/tool-search/"
  kr_set_004:
    message: "Kiro CLI cannot parse this settings file (%{error}); every kiro-cli command, chat included, exits with \"failed to parse\" until it is fixed"
    root: "Kiro CLI settings must be a JSON object of dotted setting keys, found %{found}; every kiro-cli command exits with \"failed to parse\" until it is fixed"
    suggestion: "Use plain JSON (no comments or trailing commas) with a top-level object, for example {\"chat.defaultAgent\": \"my-agent\"}"
  kr_set_005:
    message: "'%{key}' is not a Kiro CLI setting; Kiro ignores it"
    suggestion: "Check the key against kiro-cli settings list --all, or remove it"
    did_you_mean: "Did you mean '%{key}'?"
  kr_set_006:
    message: "'%{key}' does not belong in the Kiro CLI settings file; Kiro reads it only from %{file}, so it has no effect here"
    suggestion: "Move this section to %{file}"
