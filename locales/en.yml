    message: Kiro file hook for event '%{event}' is missing patterns
    suggestion: Add when.patterns for fileEdited, fileCreated and fileDeleted hooks
  kr_hk_003:
    message: 'Kiro IDE hook has no action: set then.command (runCommand) or then.prompt (askAgent)'
