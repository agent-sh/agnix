    flag_suggestion: "Remove sandbox.%{key} from the shared settings; set it in ~/.claude/settings.json where it is needed, or block it with false in managed settings."
    docker_socket_message: "sandbox.network.allowUnixSockets allows '%{socket}', which effectively grants access to the host system through the Docker socket"
    docker_socket_suggestion: "Remove the Docker socket from allowUnixSockets, or run docker through a narrow excludedCommands pattern."
    excluded_message: "sandbox.excludedCommands entry '%{command}' runs everything that tool can do outside the sandbox, with full access"
    excluded_suggestion: "Use a narrower pattern, such as 'docker compose *', or allow the extra path or host with allowWrite or allowedDomains instead."
    allow_write_message: "sandbox.filesystem.allowWrite grants writes to '%{target}', where a written file can run code outside the sandbox"
    allow_write_suggestion: "Grant only the directories the tool needs, never $PATH directories, system configuration, or shell startup files."
  cc_set_038:
    message: "Claude Code does not read .claudeignore (%{entries} entries), so these paths are not protected"
    suggestion: 'Move the entries into Read deny rules in .claude/settings.json, for example "permissions": {"deny": ["Read(./.env)", "Read(./secrets/**)"]}.'
  cc_set_039:
    message: "The project has %{files} but no Read deny rule covers it; Claude Code can read files with API keys or secrets"
    suggestion: 'Add Read deny rules, for example "permissions": {"deny": ["%{example}"]}.'
  cc_set_040:
    exclude_message: "claudeMdExcludes pattern '%{pattern}' never matches: Claude Code matches patterns against absolute file paths"
    exclude_suggestion: "Write an absolute path or a glob that can match one, for example **/%{pattern}."
    memory_dir_message: "autoMemoryDirectory '%{value}' must be an absolute path or start with ~/"
    memory_dir_suggestion: "Use an absolute path or a ~/ path, for example ~/my-memory-dir."
  cc_pl_018:
    error: Plugin name '%{name}' is reserved because it passes as one of Anthropic's own; claude plugin validate reports an error and claude plugin init and tag refuse it
    warning: Plugin name '%{name}' reads as one of Anthropic's own; claude plugin validate warns about it
    suggestion: Rename the plugin without claude, anthropic or anthropics as a word; Claude Code still loads it under the current name
  cc_pl_019:
    message: Dependency '%{name}' has version '%{version}', which is not a semantic-version range such as ~2.1.0, ^2.0 or >=1.4
    suggestion: Write the constraint as a node-semver range; the dependency installs at the highest git tag that satisfies it
  cc_pl_021:
    message: '''%{key}'' in plugin %{location} is dropped; only agent and subagentStatusLine take effect from a plugin'
    suggestion: Remove the key; plugins can't set other settings
  cc_pl_022:
    message: Monitor '%{monitor}' command references ${user_config.*}, so the monitor doesn't start
    suggestion: Have the monitor script obtain the value itself; monitors get neither ${user_config.*} nor CLAUDE_PLUGIN_OPTION_<KEY>
  cc_pl_023:
    unknown_key: Unknown key '%{key}' in %{location}; this object is strict, so the plugin fails to load
    unknown_key_suggestion: Remove the key or fix its spelling
    option_label: userConfig option '%{option}' has an option label that is not a string of 1 to 64 characters
    option_default: userConfig option '%{option}' sets options but its default is not one of them and it isn't required
    option_type: userConfig option '%{option}' sets options, which apply only to a string field that isn't multiple or sensitive
    option_suggestion: Fix the options so the plugin loads; options need Claude Code v2.1.271 or later
  cc_mcp_001:
    message: MCP server '%{server}' references ${%{var}} in %{field}, but Claude Code reads that credential variable as empty in a remote server's url and headers, so the server gets no credential
    suggestion: Copy the value into a variable with a name of your own and reference that instead of ${%{var}}
  cc_mcp_002:
    message: MCP server '%{server}' uses ${CLAUDE_PROJECT_DIR} in command or args without a default; that variable is set only in the server's environment, not in Claude Code's, so it stays unexpanded
    suggestion: Write ${CLAUDE_PROJECT_DIR:-.} or read CLAUDE_PROJECT_DIR from inside the server process
  cc_mcp_003:
    tool: MCP tool '%{tool}' has a %{len}-character description; Claude Code keeps only the first %{limit} characters of a tool that loads upfront
    instructions: MCP server instructions are %{len} characters; Claude Code keeps only the first %{limit}
    suggestion: Keep descriptions and instructions concise and put the key details and search words near the start
  cc_mcp_004:
    message: MCP server '%{server}' has a non-boolean alwaysLoad value (got %{actual})
    suggestion: Set alwaysLoad to true or false, without quotes
  cc_mcp_005:
    message: MCP server name '%{name}' is reserved for a Claude Code built-in server, so Claude Code skips this server at load time
    suggestion: Rename the server; Claude Code reserves workspace, claude-in-chrome, computer-use, Claude Preview and Claude Browser
    prompts_hidden: Prompts from an MCP server named 'anthropic-skills' don't appear in Claude Code, because the name is reserved for skills synced from claude.ai; its tools still work
    prompts_hidden_suggestion: Rename the server to list its prompts
  cc_mp_001:
    parse: 'Marketplace file does not parse as JSON: %{error}'
    parse_suggestion: Fix the JSON syntax; Claude Code can't read the marketplace
    not_object: Marketplace file must be a JSON object
    not_object_suggestion: Write the marketplace as an object with name, owner and plugins
    missing: Marketplace is missing required '%{field}'
    missing_suggestion: Set '%{field}'; name, owner (with owner.name) and plugins are required
    entry_not_object: plugins[%{index}] must be an object with name and source
    entry_missing: plugins[%{index}] is missing required '%{field}'
    entry_suggestion: Give every plugin entry a name and a source
  cc_mp_002:
    control: Marketplace name '%{name}' contains control or bidirectional-formatting characters
    impersonates: Marketplace name '%{name}' contains a non-ASCII character, which Claude Code treats as impersonating an official Anthropic marketplace
    spaces: Marketplace name '%{name}' contains spaces
    path: Marketplace name '%{name}' contains a path separator or '..', or is '.'
    charset: Marketplace name '%{name}' may use only letters, digits, '.', '_' and '-', starting with a letter or digit, so Claude Code can't install plugins from it
    claudeai: Marketplace name '%{name}' starts with 'claudeai-', which is reserved for marketplaces hosted on claude.ai
    reserved: Marketplace name '%{name}' is reserved ('%{reserved}'), so Claude Code refuses to add the marketplace
    suggestion: Choose a marketplace name of letters, digits, '.', '_' and '-' that isn't reserved
    plugin_control: Plugin name '%{name}' contains control or bidirectional-formatting characters
    plugin_spaces: Plugin name '%{name}' contains spaces
    plugin_charset: Plugin name '%{name}' may use only letters, digits, '.', '_' and '-', starting with a letter or digit, so Claude Code can't install it
    plugin_reserved: Plugin name '%{name}' is reserved because it passes as one of Anthropic's own; claude plugin validate reports it as an error
    plugin_reads_as: Plugin name '%{name}' reads as one of Anthropic's own; claude plugin validate warns about it
    plugin_suggestion: Rename the plugin entry; use kebab-case without claude or anthropic as a word
  cc_mp_003:
    duplicate: Duplicate plugin name '%{name}' in the marketplace
    duplicate_suggestion: Give each plugin entry a unique name
    traversal: Plugin source '%{source}' contains '..', which escapes the marketplace root
    backslash: Plugin source '%{source}' contains a backslash, which Claude Code refuses on macOS and Linux
    dot_slash: 'Plugin source ''%{source}'' must start with "./" (or be "." or a bare name under metadata.pluginRoot)'
    placeholder: Plugin source type 'unsupported' is a parse-time placeholder and can't be written in a marketplace
    unknown_type: 'Plugin source matches no source type (got %{kind}); use a relative path or github, url, git-subdir, npm, archive or command'
    missing_field: Plugin source of type '%{kind}' is missing required '%{field}'
    source_suggestion: See the marketplace reference "Plugin sources" for the fields each source type needs
    rename: renames entry '%{old}' does not resolve to a plugin in plugins, a key in renames, or null
    rename_suggestion: Point the rename at a current plugin name, another renames key, or null for a removed plugin
  cc_mp_004:
    hooks: plugins[%{index}].hooks is a file path or array; hooks in a marketplace entry load only as an inline object, so these never run
    hooks_suggestion: Write the hooks inline as an event map, or move them to the plugin's hooks/hooks.json
    headers_helper: Plugin '%{name}' sets headersHelper but not "strict" false, which Claude Code rejects
    headers_helper_suggestion: Set "strict" to false on an entry that uses headersHelper
    strict_conflict: 'Plugin ''%{name}'' sets "strict": false and declares %{fields}, but the plugin has its own plugin.json, so it fails to load with conflicting manifests'
    strict_conflict_suggestion: Remove the component fields from the entry, or drop "strict" false so they are appended to plugin.json
  cc_mp_005:
    unknown_key: Unknown marketplace field '%{key}'; Claude Code ignores it at load time
    unknown_key_suggestion: Remove the field or fix its spelling
    no_description: Marketplace has no description
    no_description_suggestion: Add a description so users know what the marketplace offers
    no_plugins: Marketplace has no plugins defined
    no_plugins_suggestion: Add plugin entries to plugins
    version_mismatch: Entry version '%{entry}' differs from the plugin's plugin.json version '%{manifest}'; at install time plugin.json wins
    version_mismatch_suggestion: Keep the entry and plugin.json versions in sync, or drop the entry version
    headers_no_effect: Plugin '%{name}' sets %{key}, which applies only to archive sources and has no effect here
    headers_no_effect_suggestion: Remove the field, or switch the entry to an archive source
  cc_pl_016:
    message: Plugin name '%{name}' is not kebab-case
    suggestion: Use lowercase letters, digits, and hyphens only. Claude Code rejects names with control or invisible characters.
  cc_hk_028:
    message: Command hook at %{location} uses '${user_config.*}' interpolation, which Claude Code 2.1.207+ rejects at
      load time as a shell-injection fix
    suggestion: "Read the value inside the script via $CLAUDE_PLUGIN_OPTION_<KEY> (plugin hooks) or pass it through the\
      \ environment; shell-form command strings can no longer interpolate ${user_config.*}."
  cdx_pl_015:
    message: '''skills'' must be a string path, not %{actual}'
    suggestion: Set 'skills' to a relative path string such as './skills', or remove the field


