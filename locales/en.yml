    not_object: managedMcpServers must be an object keyed by server name
    entry_not_object: managedMcpServers entry '%{name}' must be an MCP server object
    local_command: managedMcpServers entry '%{name}' names a local command, so Claude Code skips it
    suggestion: Configure an HTTP or SSE server with a URL; managedMcpServers does not distribute local stdio commands.
  cc_set_031:
    invalid: "%{location} must be one of low, medium, high, xhigh, or max"
    suggestion: Set the effort cap to low, medium, high, xhigh, or max.
  cc_set_032:
    message: allowedProviders is only honored in Claude Code managed settings
    suggestion: Move allowedProviders to your organization's managed-settings.json.
  cc_set_033:
    message: idleCompaction must be a boolean (got %{actual})
    suggestion: Set idleCompaction to a strict true/false boolean; adjust the 200K-token minimum with CLAUDE_CODE_IDLE_COMPACT_MIN_TOKENS instead.
  cc_pl_016:
    message: Plugin name '%{name}' is not kebab-case
    suggestion: Use lowercase letters, digits, and hyphens only. Claude Code rejects names with control or invisible characters.
  cc_hk_028:
    message: Command hook at %{location} uses '${user_config.*}' interpolation, which Claude Code 2.1.207+ rejects at
      load time as a shell-injection fix
    suggestion: "Read the value inside the script via $CLAUDE_PLUGIN_OPTION_<KEY> (plugin hooks) or pass it through the\
      \ environment; shell-form command strings can no longer interpolate ${user_config.*}."
  cdx_pl_015:
    message: '''skills'' must be a string path, not %{actual}'
    suggestion: Set 'skills' to a relative path string such as './skills', or remove the field


