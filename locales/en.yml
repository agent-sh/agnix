  kr_set_006:
    message: "'%{key}' does not belong in the Kiro CLI settings file; Kiro reads it only from %{file}, so it has no effect here"
    suggestion: "Move this section to %{file}"
  kr_set_007:
    message: "Kiro reads settings only as flat dotted keys; the nested '%{key}' object is ignored, so %{settings} stays unset"
    suggestion: "Write each setting as a top-level dotted key, for example \"%{example}\": <value>"
  kr_set_008:
    message: "Setting '%{key}' must be %{expected}, found %{found}; Kiro does not read the value and keeps the default"
    suggestion: "Write the value with the setting's JSON type (kiro-cli settings list --all lists each type)"
    number_fix: "Convert quoted %{value} to a JSON number (may change behavior or security policy)"
  kr_set_009:
    message: "Setting '%{key}' has value %{value}, which Kiro does not recognize; expected %{allowed}"
    suggestion: "Use one of the documented values (kiro-cli settings list --all)"
  kr_set_010:
    message: "Setting '%{key}' is set again at line %{line}; Kiro keeps only the last value and ignores this one"
    suggestion: "Remove one of the duplicate keys"
  kr_set_011:
    message: "Setting '%{key}' is global-only; Kiro ignores it in a workspace .kiro/settings/cli.json"
    suggestion: "Set it in ~/.kiro/settings/cli.json instead (kiro-cli settings --global)"
  kr_wf_001:
    steps: Workflow recipe has more than %{limit} step nodes; Kiro rejects it at load
    depth: Workflow recipe nests nodes deeper than %{limit} levels; Kiro rejects it at load
    duplicate: Duplicate workflow node id '%{id}'; node ids must be unique across the recipe
    includes: Workflow recipe has %{count} include nodes, more than the maximum of %{limit}; Kiro resolves none of them
    suggestion: Keep at most 50 step nodes and 8 nesting levels, and give every node a unique id (split large recipes with include nodes)
  kr_wf_002:
    missing_max: Repeat '%{id}' is missing the required maxIterations
    invalid_max: Repeat '%{id}' has maxIterations %{value}; it must be a positive integer
    too_many: Repeat '%{id}' has maxIterations %{value}, exceeding the maximum of %{limit}
    missing_cap: Repeat '%{id}' is missing the required onMaxIterations (abort, continue or pause)
    invalid_cap: Repeat '%{id}' has onMaxIterations %{value}; use abort, continue or pause
    both_stops: Repeat '%{id}' sets both stopCondition and stopWhen; use only one
    suggestion: Give every repeat a finite maxIterations (1-1000), choose onMaxIterations deliberately, and use either stopCondition or stopWhen
  kr_wf_003:
    message: Kiro loads '%{json}' instead of '%{name}' and reports this file as a conflict
    suggestion: Keep one suffix per recipe name; delete or rename this file
  kr_wf_004:
    parse: 'Workflow recipe is not valid %{format}: %{error}'
    message: 'Invalid workflow recipe: %{detail}'
    suggestion: Fix the recipe so it matches the workflow schema (see kiro.dev/docs/workflows/authoring), then run validate_workflow on it
  kr_wf_005:
    message: Step '%{id}' declares completion inside a parallel node; Kiro rejects interactive steps in parallel branches
    suggestion: Move the interactive step outside the parallel node
  kr_wf_006:
    not_object: Node '%{id}' has a stop condition that is not an object
    empty: Node '%{id}' has a stop condition without containsText, fileCheck or completionSignal
    signal: Node '%{id}' has completionSignal %{value}; use success, need_input or error
    file_check: 'Node ''%{id}'' has an invalid fileCheck: %{detail}'
    stop_when: 'Repeat ''%{id}'' has an invalid stopWhen ''%{value}'': %{detail}'
    unknown_watch: Repeat '%{id}' stops on '%{watch}.terminal' but the recipe has no watch node '%{watch}'
    suggestion: Use stopWhen '<watchId>.terminal' or '{{expr}} contains <text>', or a stopCondition with containsText, fileCheck (path, jsonPath, value) or completionSignal
  kr_wf_007:
    previous_parallel: Step '%{id}' references %{template} from inside a parallel branch, which has no guaranteed prior sibling
    previous_first: Step '%{id}' references %{template} but has no prior sibling step that captures output
    previous_stop: Node '%{id}' references %{template} in a stop or completion condition, which has no previous sibling
    unknown_node: Node '%{id}' references %{template} but no node with id '%{node}' exists
    no_output: Node '%{id}' references %{template} but node '%{node}' captures no output
    not_before: Node '%{id}' references %{template} but node '%{node}' does not run before it
    unknown_artifact: Node '%{id}' references %{template} but no step declares an artifact named '%{name}'
    artifact_not_before: Node '%{id}' references %{template} but no step declaring artifact '%{name}' (%{producers}) runs before it
    undeclared_input: Step '%{id}' references {{%{name}}}, which is not a declared input; Kiro passes it through as literal text
    suggestion: Reference only outputs and artifacts of nodes that run earlier in the same ordered container, and declare every bare template variable in inputs
  kr_wf_008:
    message: 'Watch ''%{id}'': %{detail}'
    suggestion: Configure the handler as documented (command handler - one static command, no args, pollIntervalSec >= 10; github-pr - prRef or url, pollIntervalSec >= 30)
  kr_wf_009:
    message: Repeat '%{id}' stops on fileCheck '%{path}', but no step inside the loop mentions that path; the loop may never stop
    suggestion: Have a step inside the loop write the fileCheck file (name the path in its prompt or artifacts)
  kr_ign_001:
    message: Negation '%{pattern}' has no effect because its parent directory '%{dir}' is excluded by '%{excluded_by}' (line %{line}); Kiro cannot re-include a file below an excluded directory
    suggestion: Exclude the directory's contents instead of the directory (for example '%{dir}/*' instead of '%{excluded_by}'), then keep the negation
  cc_set_001:
    type_error: prUrlTemplate must be a string
    empty: prUrlTemplate is set but empty - Claude Code will render no PR badge
    no_placeholder: 'prUrlTemplate has no documented placeholder - every PR will resolve to the same static URL. Supported
      placeholders: {host}, {owner}, {repo}, {number}, {url}'
    suggestion: 'Set prUrlTemplate to a URL template that includes at least one of {host}, {owner}, {repo}, {number}, or {url}.
      Example: ''https://reviews.example.com/{owner}/{repo}/pull/{number}'''
  cc_set_006:
    message: disableBundledSkills must be a boolean when present (got %{actual}); Claude Code 2.1.169+ documents only strict
      true/false for this setting
    suggestion: Set disableBundledSkills to an unquoted true or false, or set the CLAUDE_CODE_DISABLE_BUNDLED_SKILLS environment
      variable to 1 instead.
  cc_set_007:
    message: enforceAvailableModels must be a boolean when present (got %{actual}); Claude Code 2.1.175+ documents this managed
      setting as a strict true/false toggle
    suggestion: Set enforceAvailableModels to an unquoted true or false so the managed availableModels allowlist is enforced
      predictably.
  cc_set_008:
    message: sandbox.allowAppleEvents must be a boolean when present (got %{actual}); Claude Code 2.1.181+ documents this
      sandbox opt-in as a strict true/false toggle
    suggestion: Set sandbox.allowAppleEvents to an unquoted true or false, or remove it to keep Apple Events blocked in the
      macOS sandbox.
  cc_set_009:
    message: attribution.sessionUrl must be a boolean when present (got %{actual}); Claude Code 2.1.183+ documents this
      attribution toggle as a strict true/false setting
    suggestion: Set attribution.sessionUrl to an unquoted true or false. Use false to omit claude.ai session links from
      commits and PR descriptions created from web or Remote Control sessions.
  cc_set_012:
    credentials_object: sandbox.credentials must be an object with optional files and envVars arrays (got %{actual})
    credentials_object_suggestion: 'Set sandbox.credentials to an object like {"files":[{"path":"~/.aws/credentials","mode":"deny"}],"envVars":[{"name":"GITHUB_TOKEN","mode":"deny"}]} or remove it.'
    allow_plaintext_type: sandbox.credentials.allowPlaintextInject must be a boolean (got %{actual})
    allow_plaintext_suggestion: Set sandbox.credentials.allowPlaintextInject to an unquoted true or false, or remove it.
    entries_array: sandbox.credentials.%{array_key} must be an array (got %{actual})
    entries_array_suggestion: 'Set sandbox.credentials.%{array_key} to an array of objects with "%{required_key}" and a "mode" of "deny" or "mask".'
    entry_object: sandbox.credentials.%{array_key}[%{index}] must be an object (got %{actual})
    entry_object_suggestion: 'Use {"%{required_key}": "...", "mode": "deny"} or {"%{required_key}": "...", "mode": "mask"} for each sandbox.credentials.%{array_key} entry.'
    required_empty: sandbox.credentials.%{array_key}[%{index}].%{required_key} must not be empty
    required_type: sandbox.credentials.%{array_key}[%{index}].%{required_key} must be a string (got %{actual})
    required_suggestion: Set sandbox.credentials.%{array_key}[%{index}].%{required_key} to a non-empty string naming the credential target.
    env_name: 'sandbox.credentials.%{array_key}[%{index}].name must start with a letter or underscore and contain only letters, digits, and underscores (got "%{name}")'
    env_name_suggestion: Set sandbox.credentials.%{array_key}[%{index}].name to a valid environment variable name such as GITHUB_TOKEN.
    mode_value: 'sandbox.credentials.%{array_key}[%{index}].mode must be "deny" or "mask" (got "%{mode}")'
    mode_type: 'sandbox.credentials.%{array_key}[%{index}].mode must be "deny" or "mask" (got %{actual})'
    mode_suggestion: 'Set sandbox.credentials.%{array_key}[%{index}].mode to "deny" or "mask".'
    inject_hosts_array: sandbox.credentials.%{array_key}[%{index}].injectHosts must be an array of strings (got %{actual})
    inject_hosts_suggestion: Set sandbox.credentials.%{array_key}[%{index}].injectHosts to an array of host strings, or remove it.
    inject_host_type: sandbox.credentials.%{array_key}[%{index}].injectHosts[%{host_index}] must be a string (got %{actual})
    inject_host_suggestion: Replace sandbox.credentials.%{array_key}[%{index}].injectHosts[%{host_index}] with a host string.
    mask_file: 'sandbox.credentials.%{array_key}[%{index}].path must identify a single file when mode is "mask"'
    mask_file_suggestion: 'List the specific credential file to mask, or use mode "deny" for a directory.'
    extract_regex: sandbox.credentials.%{array_key}[%{index}].extract must be a valid ECMAScript regex (%{error})
    extract_regex_suggestion: Fix the regex syntax in sandbox.credentials.%{array_key}[%{index}].extract, or remove extract for whole-file masking.
    extract_capture: 'sandbox.credentials.%{array_key}[%{index}].extract must contain a capturing group when mode is "mask"'
    extract_capture_suggestion: 'Add a credential capture group to sandbox.credentials.%{array_key}[%{index}].extract, such as "token:\s*(\S+)", or remove extract for whole-file masking.'
    extract_type: sandbox.credentials.%{array_key}[%{index}].extract must be a regex string (got %{actual})
    extract_type_suggestion: Set sandbox.credentials.%{array_key}[%{index}].extract to a regex string with a credential capture group, or remove it.
    extract_no_match_value: 'sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch must be "warn", "deny", or "error" (got "%{actual}")'
    extract_no_match_type: sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch must be a string (got %{actual})
    extract_no_match_suggestion: 'Set sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch to "warn", "deny", or "error".'
    extract_no_match_jwt_value: 'sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch must be "warn" when an environment variable uses decode: "jwt" (got "%{actual}")'
    extract_no_match_jwt_suggestion: 'Set sandbox.credentials.%{array_key}[%{index}].onExtractNoMatch to "warn", or remove it.'
    mask_duplicates_type: sandbox.credentials.%{array_key}[%{index}].maskDuplicates must be a boolean (got %{actual})
    mask_duplicates_suggestion: Set sandbox.credentials.%{array_key}[%{index}].maskDuplicates to an unquoted true or false, or remove it.
    decode_value: 'sandbox.credentials.%{array_key}[%{index}].decode must be "jwt" (got "%{actual}")'
    decode_type: sandbox.credentials.%{array_key}[%{index}].decode must be a string (got %{actual})
    decode_suggestion: 'Set sandbox.credentials.%{array_key}[%{index}].decode to "jwt", or remove it.'
    extract_decode_conflict: sandbox.credentials.%{array_key}[%{index}] cannot combine extract and decode for an environment variable
    extract_decode_conflict_suggestion: Remove either extract or decode from sandbox.credentials.%{array_key}[%{index}].
    mask_claims_shape: sandbox.credentials.%{array_key}[%{index}].maskClaims must be a non-empty array of non-empty strings (got %{actual})
    mask_claims_requires_decode: 'sandbox.credentials.%{array_key}[%{index}].maskClaims requires decode: "jwt"'
    mask_claims_suggestion: 'Set decode to "jwt" and maskClaims to claim names such as ["api_key"], or remove maskClaims.'
    aws_pairs_array: sandbox.credentials.awsPairs must be an array of objects (got %{actual})
    aws_pair_object: sandbox.credentials.awsPairs[%{index}] must be an object (got %{actual})
    aws_pair_field: sandbox.credentials.awsPairs[%{index}].%{field} must be a non-empty string
    aws_pairs_suggestion: 'Use entries such as {"accessKeyIdVar":"MY_KEY_ID","secretAccessKeyVar":"MY_SECRET_KEY"} with an optional sessionTokenVar.'
    aws_pair_duplicate: sandbox.credentials.awsPairs[%{index}].%{field} reuses environment variable %{variable}, which is already used by awsPairs[%{first_index}].%{first_field}
    aws_pair_duplicate_suggestion: Use a different environment variable name for every AWS credential slot across all awsPairs entries.
    sigv4_object: sandbox.credentials.sigv4 must be an object (got %{actual})
    sigv4_entry: 'sandbox.credentials.sigv4.%{field} must be deny or passthrough, and the field must be streaming, presigned, or sigv4a (got %{actual})'
    sigv4_suggestion: Set streaming, presigned, and sigv4a policies to deny or passthrough, or remove unsupported fields.
    aws_feature_aws_pairs: awsPairs
    aws_feature_sigv4: sigv4
    aws_features_both: awsPairs and sigv4
    tls_terminate_required: AWS credential re-signing via sandbox.credentials.%{feature} requires sandbox.network.tlsTerminate to be an object
    tls_terminate_suggestion: 'Set sandbox.network.tlsTerminate to an object such as {}, or remove the AWS credential re-signing settings.'
    aws_scope: AWS credential re-signing via sandbox.credentials.%{feature} is ignored in project-level .claude settings
    aws_scope_suggestion: Move the AWS credential re-signing settings to ~/.claude/settings.json, a --settings file, or managed settings.
  cc_set_013:
    message: autoMode.classifyAllShell must be a boolean when present (got %{actual}); Claude Code 2.1.193+ documents this
      auto-mode setting as a strict true/false toggle
    suggestion: Set autoMode.classifyAllShell to an unquoted true or false, or remove it to keep the default auto-mode
      classifier scope.
  cc_set_014:
    message: autoMode in .claude/settings.local.json is silently ignored as of Claude Code 2.1.207; the key is only read
      from ~/.claude/settings.json
    suggestion: Move autoMode configuration to ~/.claude/settings.json (your global user settings file) where Claude Code
      2.1.207+ reads it.
  cc_set_015:
    message: pluginConfigs in project-level .claude settings is silently ignored since Claude Code 2.1.207; plugin option
      values are only read from user settings, --settings files, and managed settings
    suggestion: Move pluginConfigs to ~/.claude/settings.json (user-level), pass it via the --settings flag, or configure
      it in managed settings; remove it from the project-level file.
  cc_set_016:
    message: "'%{rule}' is a deprecated permission-rule form as of Claude Code 2.1.210; use '%{replacement}' instead"
    suggestion: "Replace '%{rule}' with '%{replacement}' in your permissions list."
    fix: "Replace '%{rule}' with '%{replacement}' (changes permission enforcement)"
  cc_set_017:
    message: sandbox.filesystem.disabled must be a boolean when present (got %{actual}); Claude Code 2.1.216+ uses this
      setting to disable filesystem isolation while preserving network isolation
    suggestion: Set sandbox.filesystem.disabled to an unquoted true or false, or remove it to keep filesystem isolation enabled.
  cc_set_018:
    message: emojiCompletionEnabled must be a boolean when present (got %{actual}); Claude Code 2.1.217+ uses this setting
      to control named emoji completion
    suggestion: Set emojiCompletionEnabled to an unquoted true or false, or remove it to keep emoji completion enabled.
  cc_set_019:
    message: sandbox.network.strictAllowlist must be a boolean when present (got %{actual})
    suggestion: Set sandbox.network.strictAllowlist to an unquoted true or false, or remove it.
  cc_set_020:
    message: workflowSizeGuideline must be unrestricted, small, medium, or large (got %{actual})
    suggestion: Set workflowSizeGuideline to one of unrestricted, small, medium, or large.
  cc_set_021:
    message: 'remoteControlAtStartup: true cannot enable Remote Control from project settings in Claude Code 2.1.222+;
      this value is ignored'
    suggestion: Enable Remote Control in user settings with /config, or set this field to false to disable it for the
      project.
  cc_set_022:
    message: crossSessionInbound must be accept, hold, or refuse (got %{actual})
    suggestion: Set crossSessionInbound to accept, hold, or refuse.
  cc_set_023:
    message: dialogExpiry must be 60s, 5m, 10m, or never (got %{actual})
    suggestion: Set dialogExpiry to 60s, 5m, 10m, or never.
  cc_set_024:
    message: sandbox.ripgrep is ignored in project settings in Claude Code 2.1.232+; only user settings, managed
      settings, and the --settings flag can override the sandbox ripgrep binary
    suggestion: Move the sandbox.ripgrep override to your user settings at ~/.claude/settings.json, to managed settings,
      or to a --settings file, and remove it from the repository.
  cc_set_025:
    scope_message: modelPicker is ignored in project and local settings in Claude Code 2.1.242+; it is honored only
      from user settings, managed settings, and --settings files
    scope_suggestion: Move modelPicker to user settings, managed settings, or a --settings file and remove it from the repository.
    shape_message: 'Invalid modelPicker setting: %{reason}'
    shape_suggestion: Use an object with an options array of rows containing a non-empty model string, optional string
      label and description fields, and an optional boolean replaceBuiltInOptions.
    reasons:
      not_object: modelPicker must be an object
      options_not_array: modelPicker.options must be an array
      row_not_object: modelPicker.options[%{index}] must be an object
      model_not_string: modelPicker.options[%{index}].model must be a non-empty string
      field_not_string: modelPicker.options[%{index}].%{field} must be a string
      replace_not_boolean: modelPicker.replaceBuiltInOptions must be a boolean
  cc_set_026:
    message: promptCacheTtl must be 5m or 1h (got %{actual})
    suggestion: Set promptCacheTtl to 5m or 1h.
  cc_set_027:
    message: subagentPromptCacheTtl must be 5m or 1h (got %{actual})
    suggestion: Set subagentPromptCacheTtl to 5m or 1h.
  cc_set_028:
    message: feedbackDrafts must be notify, quiet, or off (got %{actual})
    suggestion: Set feedbackDrafts to notify, quiet, or off. It is a string enum, not a boolean.
  cc_set_029:
    suggestion: Match the documented spinnerTipsOverride shape - Claude Code drops an invalid tip with a debug warning instead of reporting it.
    not_object: spinnerTipsOverride must be an object with tips, tipsFile, label, or excludeDefault (got %{actual})
    unknown_field: spinnerTipsOverride has unknown field '%{field}'
    label_not_string: spinnerTipsOverride.label must be a string (got %{actual})
    label_too_long: spinnerTipsOverride.label is %{len} characters, over the %{max} character limit
    exclude_default_not_bool: spinnerTipsOverride.excludeDefault must be a boolean (got %{actual})
    tips_file_not_string: spinnerTipsOverride.tipsFile must be a string path (got %{actual})
    tips_file_relative: spinnerTipsOverride.tipsFile '%{path}' is not absolute or ~/-rooted, so Claude Code cannot load it
    tips_not_array: spinnerTipsOverride.tips must be an array (got %{actual})
    tip_not_object: spinnerTipsOverride.tips entry %{index} must be a string or an object (got %{actual})
    tip_id: spinnerTipsOverride.tips entry %{index} needs an 'id' of up to 64 letters, digits, '.', '_', or '-'
    tip_text: spinnerTipsOverride.tips entry %{index} needs a non-empty 'text' of at most %{max} characters
    tip_range: spinnerTipsOverride.tips entry %{index} has '%{field}' outside %{min}..%{max}
    tip_unknown_field: spinnerTipsOverride.tips entry %{index} has unknown field '%{field}'
