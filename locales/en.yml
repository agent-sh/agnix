    suggestion: 'See geminicli.com/docs/core/subagents ("Configuration schema") and core/remote-agents: "The file MUST start with YAML frontmatter enclosed in triple-dashes ---", name is a slug of lowercase letters, numbers, hyphens and underscores, a local agent needs a description, a remote agent needs agent_card_url or agent_card_json.'
  gm_ag_003:
    message: "Unknown key '%{key}' in %{kind} Gemini agent frontmatter; the agent loader's strict schema rejects the file"
    suggestion: 'agentLoader.ts accepts only these %{kind} agent keys: %{valid}. Remove or rename the key.'
    system_prompt_suggestion: The Markdown body after the closing --- is the agent's system prompt; move the text there and remove system_prompt from the frontmatter.
    mcp_servers_camel_case: "Gemini agent frontmatter uses 'mcpServers' as the subagents page shows, but the agent loader's strict schema accepts only 'mcp_servers'"
    mcp_servers_camel_case_suggestion: 'Rename mcpServers to mcp_servers (and httpUrl / includeTools / excludeTools inside it to http_url / include_tools / exclude_tools). agnix read this from agentLoader.ts; it was not run against a live gemini binary.'
  gm_ag_004:
    not_positive_integer: "Gemini agent %{field} must be a positive integer, found %{value}; the agent loader rejects the file"
    temperature_not_number: 'Gemini agent temperature must be a number, found %{found}; the agent loader rejects the file'
    temperature_range: 'Gemini agent temperature %{value} is outside the documented range 0.0 to 2.0'
    suggestion: 'geminicli.com/docs/core/subagents: "temperature: Model temperature (0.0 - 2.0)", max_turns defaults to 30 and timeout_mins to 10 (agentLoader.ts: z.number().int().positive()).'
