name: Add to project
on:
  issues:
    types: [opened, transferred]
  pull_request:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@244f685bbc3b7adfa8466e08b698b5577571133 # v1
        with:
          project-url: https://github.com/orgs/agent-sh/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
