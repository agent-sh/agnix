  cdx_pl_018:
    name: "Plugin name '%{name}' does not meet public submission rules (at most 64 lowercase letters, digits and single hyphens)"
    too_long: "interface.%{field} has %{length} characters; public submission allows at most %{max}"
    capabilities: "interface.capabilities has %{count} entries; public submission allows at most 20, each at most 120 characters"
    hooks: Plugins with lifecycle hooks are not eligible for the public plugin directory
    apps: Plugin packages with app references cannot currently be submitted
    suggestion: These limits apply to public directory submission; ignore them for plugins you install manually
  cdx_pl_019:
    client_secret: "MCP server '%{server}' has a client secret in %{field}; the plugin manifest does not accept a clientSecret field"
    client_secret_suggestion: Remove the secret from the package and supply it through the connection setup flow
    header: "MCP server '%{server}' sends a literal credential in header '%{header}'; do not embed tokens in plugin server headers"
