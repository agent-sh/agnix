    disallowed_specifier_suggestion: To keep the tool and block only those calls, add '%{entry}' to permissions.deny in settings instead
    agent_type_list: tools entry '%{entry}' limits spawnable agent types only when this agent runs as the main thread with claude --agent; as a subagent the type list is ignored
    agent_type_list_suggestion: If this file is used as a subagent, write 'Agent' without a type list
  cc_pl_014:
    message: Plugin agent sets '%{field}', which Claude Code ignores for agents in plugin '%{plugin}'
    suggestion_remove: Remove '%{field}' from the plugin agent; it has no effect there
    suggestion_plugin_level: Remove '%{field}' and declare it at plugin level (hooks/hooks.json or the plugin's MCP servers)
  cc_ag_020:
    message: "Local agent name '%{name}' starts with '-', contains ':', or exceeds 256 characters"
    suggestion: "Use a name of at most 256 characters without a leading '-' or ':'"
  cc_mem_004:
    message: npm script '%{script}' not found in package.json
    suggestion_no_scripts: No scripts defined in package.json.
    suggestion_available: 'Available scripts: %{scripts}'
  cc_mem_005:
    message: Generic instruction '%{text}' - Claude already knows this
    suggestion: Remove generic instructions. Focus on project-specific context.
    fix: Remove generic instruction line
  cc_mem_006:
    message: Negative instruction '%{text}' without positive alternative
    suggestion: 'Add a positive alternative: ''Instead, do...'' or ''Use X instead.'''
  cc_mem_008:
    message: Critical keyword '%{keyword}' at %{percent} percent of document (middle zone)
    suggestion: Move critical content to the top or bottom of the document for better recall.
  cc_mem_010:
    message: "%{file} has %{overlap} percent word overlap with README.md (agnix heuristic threshold: %{threshold} percent)"
    suggestion: "Claude can read the README when it needs it. Keep pitfalls, rationale and conventions in CLAUDE.md, and cut what repeats the README or what Claude can derive from the code."
  cc_mem_011:
    message: 'Invalid glob pattern ''%{pattern}'' in paths field (item %{index}): %{error}'
    suggestion: 'Fix the glob pattern syntax. Valid examples: ''src/**/*.ts'', ''*.rs'', ''tests/**/*.test.js'''
    parse_error: "Invalid rule frontmatter (%{error}); Claude Code ignores the frontmatter and loads this rule in every session as if it had no paths"
    parse_error_suggestion: "Fix the YAML between the --- markers (close it with a line containing only ---) so the paths field applies."
  cc_mem_012:
    message: Unknown frontmatter key '%{key}' in .claude/rules file
    suggestion: Only 'paths' is a recognized key in .claude/rules/*.md frontmatter. Remove '%{key}' or check for typos.
  cc_mem_014:
    message: "%{file} has %{lines} lines; Claude Code recommends keeping each CLAUDE.md under %{limit} lines because longer files use more context and reduce adherence"
    suggestion: "Move guidance that applies to part of the codebase into path-scoped .claude/rules/ files and multi-step procedures into skills. @imports and CLAUDE.local.md also load at launch, so they do not reduce context."
    rule_message: "Rule file has %{lines} lines; Claude Code counts each rules file as a separate instruction file and recommends under %{limit} lines"
    rule_suggestion: "Add a paths field so the rule loads only for matching files, split it into narrower rules, or move procedures into a skill."
    rule_scoped_suggestion: "Split the rule into narrower path-scoped rules, or move procedures into a skill."
    import_message: "Imported file '@%{import}' has %{lines} lines; Claude Code counts each @path import as a separate instruction file and recommends under %{limit} lines"
    import_suggestion: "Imports load at launch with the file that names them. Move part-of-codebase guidance into path-scoped .claude/rules/ files and procedures into skills, or trim the imported file."
  cc_mem_015:
    message: "Instruction files loaded at launch total %{lines} lines across %{files} files (%{breakdown}); Claude Code warns when files add up past a combined limit (agnix heuristic: %{limit} lines)"
    suggestion: "Add paths to rules that apply to part of the codebase so they load on demand, move procedures into skills, and trim content Claude can derive from the code."
  cc_mem_016:
    message: "MEMORY.md has %{lines} lines and %{bytes} bytes; Claude Code loads only the first 200 lines or 25KB, so everything from line %{line} on is not loaded"
    suggestion: "Keep one line per entry in MEMORY.md, move detail into topic files, and merge or drop stale entries."
  cc_mem_017:
    message: "%{count} lines use emphasis such as IMPORTANT, MUST or NEVER (first at lines %{lines}); Claude Code advises emphasizing only the one line Claude keeps skipping, because emphasis on many lines makes none stand out"
    suggestion: "Write the instructions in plain, specific language and give the reason behind each; keep emphasis for a single instruction Claude keeps missing. Current Claude models over-trigger on aggressive wording such as 'CRITICAL: You MUST'."
  cc_mem_018:
    prose_message: "%{file} asks Claude in prose to read AGENTS.md ('%{text}'); Claude sees AGENTS.md only if it decides to open the file"
    prose_suggestion: "Replace the sentence with an @AGENTS.md import, or delete CLAUDE.md so Claude Code reads AGENTS.md directly."
    local_message: "CLAUDE.local.md stops Claude Code from reading the AGENTS.md next to it: with no CLAUDE.md here or above, CLAUDE.local.md counts as the project's CLAUDE.md"
    local_suggestion: "Add a CLAUDE.md that contains @AGENTS.md, or set Project instructions to claude-md-and-agents-md in /config."
