    suggestion: Consider adding '%{field}' field to plugin.json
  cc_pl_005:
    message: Plugin name must not be empty
    suggestion: Set a non-empty plugin name
  cc_pl_006:
    message: 'Failed to parse plugin.json: %{error}'
    suggestion: Validate JSON syntax in plugin.json -- check for missing commas, brackets, or unquoted keys
  cc_pl_007:
    message: 'Invalid component path in ''%{field}'': ''%{path}'' must be relative (no absolute paths or ''..'' traversal)'
    suggestion: Use a relative path starting with './' (e.g., './skills/')
    agents_entry: '''agents'' entries must be .md file paths (directories aren''t accepted), got %{value}'
    skills_entry: '''skills'' entries must be directories, got the file ''%{value}'''
    entry_suggestion: List agent .md files in 'agents' and skill directories in 'skills'
    missing: Component path '%{path}' in '%{field}' does not exist, so it doesn't load
    missing_suggestion: Create the file or directory, or fix the path; every component path must exist
  cc_pl_008:
    message: 'Component path in ''%{field}'' points inside .claude-plugin/: ''%{path}'''
    suggestion: Move the component to the plugin root directory and update the path
