    suggestion: 'Use one of: ''auto'', ''concise'', ''detailed'', ''none'''
  cdx_cfg_017:
    type_error: Field 'history' must be an object
    suggestion: Shape the history field as an object (e.g., `[history]` table in TOML)
  cdx_cfg_018:
    type_error: Field 'tui' must be an object
