    suggestion: "Fix JSON syntax and ensure mcpServers is an object"
  kr_mcp_001_jsonc:
    message: "Kiro CLI 2.x (V2 engine) cannot parse this mcp.json (%{error}): comments and trailing commas are accepted only by the V3 engine, so V2 loads no server from this file"
    suggestion: "Remove comments and trailing commas so every Kiro engine can read the file"
  kr_mcp_001_plugin:
    suggestion: "Agent Plugins mcp.json must be plain JSON (no comments or trailing commas) with an mcpServers object"
  kr_mcp_002:
    message: "Kiro MCP server '%{server}' has potential hardcoded secret in %{field} '%{key}'"
    suggestion: "Use environment variable indirection such as ${VAR_NAME} instead of plaintext secrets"
  kr_mcp_003:
    message: "Kiro MCP server '%{server}' command '%{command}' includes its arguments; Kiro starts command as a single executable without a shell, so the server fails to start"
    suggestion: "Keep only the executable in command and move the arguments to args, for example \"command\": \"npx\", \"args\": [\"-y\", \"package\"]"
  kr_mcp_004:
    message: "Kiro MCP server '%{server}' has invalid url '%{url}': %{reason}"
    suggestion: "Use an https:// URL, or http:// for a server on localhost, 127.0.0.1 or ::1"
    reasons:
      not_url: "it is not a valid URL, so Kiro skips this server"
      scheme: "Kiro reaches remote MCP servers over HTTPS (or HTTP on localhost), and a '%{scheme}' URL cannot be used"
  kr_mcp_005:
    message: "MCP server '%{server}' is defined again at line %{line}; Kiro keeps only the last definition and ignores this one"
    suggestion: "Remove or rename one of the definitions"
  kr_mcp_006:
    message: "Kiro MCP server '%{server}' has invalid OAuth configuration: %{reason}"
    suggestion: "Use the documented optional OAuth fields on an HTTP(S) remote MCP server, or remove the oauth block"
    reasons:
      client_id_non_empty: "'oauth.clientId' must not be empty"
      client_secret_non_empty: "'oauth.clientSecret' must not be empty"
      client_secret_requires_client_id: "'oauth.clientSecret' is only meaningful alongside 'oauth.clientId'"
      redirect_uri_format: "'oauth.redirectUri' must be \":port\", \"localhost:port\", \"127.0.0.1:port\" or \"http://localhost:port/path\" with a port from 1 to 65535; the V3 engine skips the server otherwise"
      redirect_uri_query: "'oauth.redirectUri' must not contain a query string or fragment; the V3 engine skips the server otherwise"
      client_metadata_url: "'oauth.clientMetadataUrl' must be an https URL with a path (for example https://example.com/client-metadata.json); the V3 engine skips the server otherwise"
      http_url: "'oauth' can only be used with HTTP(S) remote MCP server URLs"
      client_metadata_url_ignored: "'oauth.clientMetadataUrl' is ignored because 'oauth.clientId' is set; Kiro uses the client ID and never consults the metadata document"
      client_metadata_url_redirect: "'oauth.clientMetadataUrl' needs a pinned 'oauth.redirectUri'; the authorization server checks the callback against your metadata document, so Kiro's random loopback port is rejected on every connect"
  kr_mcp_007:
    message: "Kiro MCP server '%{server}' field '%{field}' must be %{expected}, found %{found}: %{effect}"
    server_message: "Kiro MCP server '%{server}' must be an object, found %{found}: %{effect}"
    suggestion: "Fix the value type; Kiro does not coerce MCP configuration values"
    effects:
      both: "Kiro CLI 2.x (V2 engine) rejects the whole mcp.json and the V3 engine skips this server"
      v2: "Kiro CLI 2.x (V2 engine) rejects the whole mcp.json"
      v3: "the V3 engine skips this server"
  kr_mcp_008:
    message: "Kiro MCP server '%{server}' url '%{url}' uses plain http for a host that is not local; the V3 engine accepts only https or http on localhost, 127.0.0.1 or ::1, and skips this server"
    suggestion: "Use https:// for remote MCP servers"
  kr_mcp_009:
    message: "Kiro MCP server '%{server}' %{field} contains '%{reference}', which Kiro does not expand; only ${NAME} references are replaced, so the server receives the text literally"
    editor_message: "Kiro MCP server '%{server}' %{field} contains the editor variable '%{reference}'; Kiro replaces ${NAME} only with an environment variable of that name, so the server normally receives the text literally"
    suggestion: "Use ${NAME} for environment variables (for example \"${GITHUB_TOKEN}\"), or write the value out"
  kr_mcp_010:
    message: "Kiro MCP server '%{server}' has unknown field '%{field}', which Kiro ignores"
    suggestion: "Remove the field or check its spelling against the Kiro MCP server fields"
    did_you_mean: "Did you mean '%{field}'?"
  kr_mcp_011:
    message: "Kiro MCP server '%{server}' has both command and url; the V3 engine starts the command (stdio) and ignores url"
    suggestion: "Keep command for a local server or url for a remote one, not both"
  kr_mcp_012:
    schema_message: "Agent Plugins mcp.json has a missing or unsupported $schema, so Kiro loads none of this power's MCP servers"
    version_message: "Agent Plugins mcp.json targets Agent Plugins %{mcp} but plugin.json targets %{manifest}, so Kiro loads none of this power's MCP servers"
    suggestion: "Set \"$schema\" to https://agent-plugins.org/schemas/1.x.y/mcp.schema.json with the same version as plugin.json"
  kr_mcp_013:
    message: "Agent Plugins mcp.json field '%{field}' is not part of the Agent Plugins MCP configuration, so Kiro loads none of this power's MCP servers"
    suggestion: "Keep only \"$schema\" and \"mcpServers\" at the top level of a plugin mcp.json"
  kr_mcp_014:
    message: "Agent Plugins MCP server '%{server}' is skipped: %{reason}"
    suggestion: "Follow the Agent Plugins MCP schema (stdio servers take type, command, args, env and cwd; streamable-http and sse servers take type, url and headers)"
    reasons:
      not_object: "the entry must be an object"
      type_missing: "\"type\" must be \"stdio\", \"streamable-http\" or \"sse\""
      type_unknown: "type \"%{value}\" is not \"stdio\", \"streamable-http\" or \"sse\""
      unknown_field: "field '%{field}' is not allowed for a %{server_type} server"
      command_missing: "a stdio server needs a non-empty string command"
      command_path: "command must be a bare executable name or a \"./\" path inside the power"
      command_escapes: "a \"./\" command must stay inside the power directory"
      args: "args must be an array of strings"
      env: "env must be an object of strings"
      env_reserved: "env must not define PLUGIN_ROOT or PLUGIN_DATA (Kiro sets them)"
      cwd: "cwd must be a string starting with \"./\", ${PLUGIN_ROOT} or ${PLUGIN_DATA}, without \"..\""
      url_missing: "a remote server needs a non-empty string url"
      url_invalid: "url must be a valid http or https URL"
      url_userinfo: "url must not contain a user name or password"
      url_fragment: "url must not contain a fragment"
      url_insecure: "a url to a host that is not local must use https"
      headers: "headers must be an object of strings with no names that differ only in case"
  kr_mcp_015:
    message: "Kiro MCP server '%{server}' auto-approves every tool with autoApprove [\"*\"]; Kiro advises auto-approving only trusted, read-only tools with limited scope"
    suggestion: "List the specific tool names to auto-approve (Kiro CLI V3 ignores autoApprove and approves MCP tools through permission rules)"
  pe_002:
    message: Chain-of-thought phrase '%{phrase}' used with simple task '%{task}'
    suggestion: "Drop the step-by-step instruction for this simple operation; for real reasoning tasks a general instruction such as 'think thoroughly' usually works better than a prescribed plan"
  pe_004:
    message: Ambiguous term '%{term}' creates unclear instruction
    suggestion: "Replace the hedge with a condition Claude can check (e.g., 'when the change touches src/api/'), or state the rule without it"
  pe_005:
    message: "Generic instruction '%{phrase}' adds no project-specific guidance"
    suggestion: "Remove it, or replace it with the concrete convention it stands for (e.g., 'Use 2-space indentation' instead of 'write clean code')"
  pe_006:
    message: Negative instruction '%{text}' without positive alternative
    suggestion: "Say what to do instead (e.g., 'Instead, use...'), or give the reason for the prohibition"
  cc_pl_001:
    message: plugin.json must be located in .claude-plugin/ directory
    suggestion: Move plugin.json to .claude-plugin/plugin.json
    shared_root: "Claude Code reads a plugin manifest only from .claude-plugin/plugin.json and ignores this file; GitHub Copilot reads a plugin.json at the plugin root"
    shared_root_suggestion: "For a Claude Code plugin, move it to .claude-plugin/plugin.json. For a GitHub Copilot plugin, keep it here and leave Claude Code out of `tools` in .agnix.toml"
  cc_pl_002:
    message: Component '%{component}' must not be inside .claude-plugin/
    suggestion: Move components to the plugin root directory
  cc_pl_003:
    message: 'Non-semver version: ''%{version}'' (optional recommendation for version-constrained dependencies)'
    suggestion: 'Consider semver for dependency compatibility: 1.0.0, 1.0.0-rc.1, 1.0.0+build'
  cc_pl_004:
    message: 'Missing or invalid required field: %{field}'
