    parse_error: 'Failed to parse agent frontmatter: %{error}'
    parse_error_suggestion: Check YAML frontmatter syntax -- ensure proper indentation, colon spacing, and matching quotes
  cc_ag_008:
    message: Invalid memory scope '%{scope}'. Must be 'user', 'project', or 'local'
    suggestion: 'Use one of: user, project, local'
    fix: Change memory scope to '%{fixed}'
  cc_ag_009:
    message: 'Unknown tool ''%{tool}'' in tools list. Known tools: %{known}. MCP tools must use lowercase mcp__<server> or
      mcp__<server>__<tool> format'
    suggestion: Use a known Claude Code tool name or a valid MCP tool (mcp__<server> or mcp__<server>__<tool>, case-sensitive
      lowercase prefix, no glob in the server segment)
  cc_ag_010:
    message: 'Unknown tool ''%{tool}'' in disallowedTools list. Known tools: %{known}'
    suggestion: Use a known Claude Code tool name or a valid MCP tool (mcp__<server> or mcp__<server>__<tool>, case-sensitive
      lowercase prefix, no glob in the server segment)
  cc_ag_011:
    message: 'Invalid hooks configuration in agent frontmatter: %{error}'
    suggestion: Ensure hooks follow the same schema as settings.json hooks
  cc_ag_012:
    message: permissionMode 'bypassPermissions' is restricted to an already-bypassing parent in Claude Code 2.1.267 or later; review older versions separately
    suggestion: Review the parent permission mode and pinned Claude Code version before enabling bypassPermissions
    fix: Replace 'bypassPermissions' with 'default'
  cc_ag_019:
    unknown: Unknown agent frontmatter field '%{field}'; Claude Code ignores fields it doesn't recognize
    unknown_suggestion: 'Remove or rename ''%{field}'' - known fields: %{known}'
    cache_ttl_suggestion: Write cacheTtl inside the experimental map (experimental.cacheTtl), not at the top level
    auto_compact_window: autoCompactWindow %{value} is ignored; Claude Code accepts a plain integer token count from 100000 to 1000000
