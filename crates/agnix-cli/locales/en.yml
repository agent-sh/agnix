    message: Skill file contains what looks like a credential
    suggestion: Remove the secret and read it from an environment variable or secret store at run time
  xp_sk_004:
    message: Path '%{path}' uses Windows backslashes, which fail on macOS and Linux
    suggestion: Use forward slashes ('%{fixed}'); they work on every platform
  cc_hk_001:
    message: 'Invalid hook event ''%{event}'', valid events: %{valid}'
    fix: Replace '%{old}' with '%{new}'
  cc_hk_002:
    message: '%{hook_type} hook at %{location} is not supported on ''%{event}'' events'
    suggestion: 'Use a supported event for this %{hook_type} hook, or use ''type'': ''command'' instead'
  cc_hk_003:
    message: Tool event '%{event}' at %{location} has no matcher field; omitting it matches all tools
    suggestion: Consider adding a 'matcher' field to target specific tools (e.g., 'Bash', 'Read')
  cc_hk_004:
    message: Non-tool event '%{event}' at %{location} must not have a matcher field
    suggestion: Remove the 'matcher' field
  cc_hk_005:
    message: Hook at %{location} is missing required 'type' field
    suggestion: 'Add ''type'': ''command'', ''type'': ''prompt'', or ''type'': ''agent'''
  cc_hk_006:
    message: Command hook at %{location} is missing required 'command' field
    suggestion: Add a 'command' field with the command to execute
  cc_hk_007:
    message: Prompt/agent hook at %{location} is missing required 'prompt' field
    suggestion: Add a 'prompt' field with the prompt text
  cc_hk_008:
    message: Script file not found at '%{script}' (resolved to '%{resolved}')
    suggestion: Create the script file or correct the path
  cc_hk_009:
    message: 'Potentially dangerous command pattern detected: %{reason}'
    suggestion: 'Review the command for safety. Pattern matched: %{pattern}'
  cc_hk_010:
    message: Hook at %{location} sets timeout %{timeout}s on SessionEnd, but SessionEnd hooks share a budget that settings raise to at most 60 seconds
    suggestion: Keep SessionEnd work under 60 seconds, or set CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS when it needs longer
    plugin_message: Plugin SessionEnd hook at %{location} sets timeout %{timeout}s, but timeouts on plugin-provided hooks don't raise the 1.5-second SessionEnd budget
    plugin_suggestion: Keep plugin SessionEnd work under 1.5 seconds; a user can raise the budget with CLAUDE_CODE_SESSIONEND_HOOKS_TIMEOUT_MS or a timeout in their own settings
