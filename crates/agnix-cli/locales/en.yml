  file_read_error: 'Failed to validate file: %{error}'
  file_read_error_suggestion: Check file permissions and ensure the file is not locked by another process
  xp_004_read_error: 'Failed to read instruction file: %{error}'
  xp_004_read_error_suggestion: Check file permissions and ensure the file exists and is readable
  invalid_glob_pattern: 'Ignoring invalid glob pattern ''%{pattern}'': %{error}'
  invalid_glob_pattern_suggestion: 'Fix the glob pattern syntax. Use standard glob characters: *, **, ?, [abc]'
  cdx_cfg_014:
    type_error: Field 'model' must be a string
    suggestion: Set 'model' to a valid Codex model identifier (e.g. 'gpt-5', 'claude-sonnet-4-5')
  cdx_cfg_015:
    type_error: Field 'model_provider' must be a string
    suggestion: Set 'model_provider' to a valid provider name (e.g. 'openai', 'anthropic')
  cdx_cfg_016:
    message: 'Invalid model_reasoning_summary ''%{value}''. Valid values: ''auto'', ''concise'', ''detailed'', ''none'''
