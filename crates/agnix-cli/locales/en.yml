    message: "The Codex instruction chain through this file reaches %{bytes} bytes across %{count} files, past the %{limit}-byte project_doc_max_bytes default; Codex stops adding files at the limit"
    suggestion: Trim this file (the largest in the chain), move guidance into deeper nested AGENTS.md files, or raise project_doc_max_bytes
