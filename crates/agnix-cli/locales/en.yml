# ===========================================================================
# Rules - Validator diagnostic messages, suggestions, assumptions, fixes
# ===========================================================================
rules:
  kr_hk_014:
    alias: "Hook trigger alias %{trigger} is accepted; the canonical name is %{canonical}"
    alias_suggestion: "Use the canonical PascalCase trigger when editing V3 hooks. Kiro maps the alias to it, so both behave the same."
    fix: "Normalize hook trigger to %{canonical}"
    legacy: "Legacy .kiro.hook uses CLI trigger spelling %{trigger} without a corresponding V3 JSON hook in this directory"
    legacy_suggestion: "If this hook is intended for CLI V3, migrate it to a versioned .kiro/hooks/*.json file. Legacy IDE manual hooks can remain in their original format."
  kr_pm_001:
    parse_error: "Kiro cannot load this permissions file (%{error}); it rejects every rule in it and fails closed, denying all tool calls until the file is fixed"
    shape: "Kiro permissions must be a mapping containing a rules array; an empty file or any other shape is rejected and Kiro fails closed, denying all tool calls"
    entry: "Permission rule at index %{index} must be a mapping; Kiro rejects the whole file and fails closed, denying all tool calls"
    suggestion: "Use rules: [] or a list of capability/effect mappings in permissions.yaml."
  kr_pm_002:
    missing: "Permission rule at index %{index} has a missing or non-string capability; Kiro rejects the whole file and fails closed, denying all tool calls"
    unknown: "Permission rule at index %{index} has unknown capability '%{capability}'; Kiro skips this rule"
    suggestion: "Use a documented capability such as shell, fs_read, fs_write, mcp, or a meta-capability (all, builtin, filesystem)."
  kr_pm_003:
    message: "Permission rule at index %{index} has a missing or invalid effect; %{consequence}"
    evaluate: "Permission rule at index %{index} uses effect 'evaluate', which Kiro does not support yet; the rule is skipped"
    scope: "Permission rule at index %{index} uses effect '%{effect}', which an administrator managed-settings.json cannot contain; %{consequence}"
    suggestion: "Set effect to allow, deny, or ask. Review the policy before changing access."
    admin_suggestion: "Administrator policies may only deny or ask; grant allow rules in user, workspace or agent permissions instead."
  kr_pm_004:
    message: "Permission rule at index %{index}: %{field} must be an array of strings; %{consequence}"
    suggestion: "Use a list of quoted glob patterns. Omit match for unrestricted scope; exclude is optional."
  kr_pm_005:
    message: "Permission rule at index %{index} has unknown field(s) %{fields}; %{consequence}"
    suggestion: "A permission rule takes only capability, effect, match and exclude."
  kr_pm_006:
    not_array: "Kiro permissions 'policies' must be an array of preset id strings; Kiro rejects the whole file and fails closed, denying all tool calls"
    unknown: "Kiro permissions preset '%{policy}' is unknown and skipped"
    admin: "Kiro permissions preset '%{policy}' contains allow rules, which an administrator policy cannot hold; Kiro skips them"
    suggestion: "Use preset ids allow-all, edit-workspace, read-workspace, read-all, read-only-shell or dev-shell."
  kr_pm_007:
    message: "Permission rule at index %{index}: %{field} pattern %{reason}"
    mcp_at: "'%{pattern}' never matches; MCP permission resources are server/tool without '@' (use '%{fixed}')"
    web_fetch_url: "'%{pattern}' never matches; web_fetch rules are compared with the URL host name (for example docs.example.com or *.example.com)"
    no_resource: "'%{pattern}' never matches; %{capability} requests have no resource to compare, so only '*' (or no match) applies"
    protected_path: "'%{pattern}' has no effect for an allow rule; Kiro always asks before (or denies) agent writes to .git, .vscode, .kiroignore, *.code-workspace and the .kiro agents, hooks, workflows, powers and settings directories"
    suggestion: "Rewrite the pattern in the form Kiro compares for this capability; see kiro.dev/docs/permissions."
  kr_pm_008:
    message: "Permission rule at index %{index} has match: [], which Kiro treats like an omitted match: the %{effect} rule applies to every %{capability} resource"
    suggestion: "List the resources the rule should cover, or omit match to make the full scope explicit."
  kr_pm_009:
    message: "Kiro does not read permission policies from this location; it reads ~/.kiro/settings/permissions.yaml (user) and ~/.kiro/workspace-roots/<hash>/permissions.yaml (workspace), so these rules are not applied"
    admin: "Kiro reads an administrator policy only from the operating-system managed-settings.json path (/Library/Application Support/Kiro/, /etc/kiro/ or C:\\ProgramData\\Kiro\\), so these rules are not applied from here"
    suggestion: "Install the policy in a location Kiro reads (copy it to ~/.kiro/settings/permissions.yaml, or let Kiro write workspace rules to ~/.kiro/workspace-roots), or keep this file only as a template."
    shadowed: "Kiro ignores this permissions.json because permissions.yaml exists in the same directory and is read instead"
    shadowed_suggestion: "Merge the rules into permissions.yaml and remove permissions.json."
  kr_pm_common:
    fatal: "Kiro rejects the whole file and fails closed, denying all tool calls until it is fixed"
    latent: "Kiro already skips this rule for its unknown capability, and will reject the whole file and fail closed once the capability is fixed"
  kr_pm_010:
    message: "Permission rule at index %{index} allows %{capability} with no match restriction and no exclude; Kiro advises specific patterns over wildcards and allowing only what the agent needs"
    suggestion: "List the commands, paths or servers to allow, or add exclude patterns for dangerous ones."
  kr_pm_011:
    message: "Permission rule at index %{index}: pattern '%{pattern}' uses %{syntax}, which Kiro does not support for %{capability} patterns (only * is a wildcard; ** acts as *, ? and [...] match literally)"
    suggestion: "Use * as the only wildcard in shell, web and MCP patterns."
  kr_pm_012:
    message: "Permission rule at index %{index} denies '%{host}', but sandbox_network rules are first-match and the earlier allow rule at index %{allow} already matches it, so this deny never applies"
    suggestion: "Move the specific deny before the broader allow."
  oc_dep_005:
    message: "Deprecated top-level key '%{key}'. TUI settings belong in tui.json"
    cleanup_suggestion: "Move '%{key}' to tui.json first. Only use the unsafe cleanup after migration is complete; it deletes legacy TUI settings without moving them."
    cleanup_fix: "Remove legacy TUI settings only after migration to tui.json is complete (does not move configuration)"
  oc_dep_002:
    message: "Deprecated key 'tools'. Use 'permission' instead"
    agent_message: "Agent '%{agent}' uses deprecated 'tools'; use the agent's permission field"
    migration_suggestion: "Migrate tools boolean values to permission actions/rules; do not only rename the key. Legacy tools remains supported."
  cop_027:
    message: "Field 'infer' is retired on GitHub.com and deprecated in VS Code; use 'disable-model-invocation' and 'user-invocable' instead"
    suggestion: "Replace 'infer' with 'disable-model-invocation' (the inverse of infer) and 'user-invocable'."
    fix: "Replace infer with invocation controls, preserving explicit fields"
  boolean_unwrap:
    json_fix: "Convert quoted %{value} to a JSON boolean (may change behavior or security policy)"
    yaml_fix: "Convert quoted %{value} to a YAML boolean (may change behavior or security policy)"
  as_001:
    message: SKILL.md must have YAML frontmatter between --- markers
    suggestion: Add frontmatter between --- markers
  as_002:
    message: Skill frontmatter is missing required 'name' field
    suggestion: 'Add ''name: your-skill-name'' to frontmatter'
  as_003:
    message: Skill frontmatter is missing required 'description' field
    suggestion: 'Add ''description: Use when...'' to frontmatter'
  as_004:
    message: Name '%{name}' must be 1-64 characters of lowercase letters, digits and hyphens
    suggestion: Lowercase and trim the name, replace spaces and '_' with '-', collapse multiple '-' into one, remove invalid
      characters, and keep it within 64 characters
    fix: 'Convert name to kebab-case: ''%{name}'''
    claude_refused: 'Claude Code refuses the skill name ''%{name}'': it contains %{what}'
    claude_upload: Name '%{name}' is not lowercase kebab-case; Claude Code loads it, but the Claude API and claude.ai require
      lowercase letters, numbers and hyphens (at most 64)
    opencode_2: "Skill name '%{name}' is not lowercase kebab-case; OpenCode 2 takes the skill ID from the file path and accepts it, but OpenCode 1 and other clients reject it"
  as_005:
    message: Name '%{name}' cannot start or end with hyphen
    suggestion: Remove leading/trailing hyphens from the name
  as_006:
    message: Name '%{name}' cannot contain consecutive hyphens
    suggestion: Replace '--' with '-' in the name
  as_008:
    message: Description must be 1-%{max} characters, got %{len}
    suggestion: Trim the description to %{max} characters or fewer
    claude_truncated: description and when_to_use are %{len} characters; Claude Code truncates them at %{max} in the skill
      listing
    claude_truncated_suggestion: Put the key use case first and trim the text below %{max} characters, or raise skillListingMaxDescChars
    claude_api: Description is %{len} characters; the Claude API and claude.ai accept at most 1024 when the skill is uploaded
  as_009:
    message: Description must not contain XML tags
    suggestion: Remove XML tags from the description
  as_011:
    message: Compatibility must be 1-500 characters, got %{len}
    suggestion: Trim compatibility to 500 characters or fewer
  as_012:
    message: Skill content exceeds 500 lines (got %{count})
    suggestion: Move extra content into references/
  as_013:
    message: '''%{path}'' links ''%{nested}'', which SKILL.md does not link; keep references one level deep from SKILL.md'
    suggestion: Link '%{nested}' directly from SKILL.md and say when to read it, so agents read it whole
  as_015:
    message: Skill directory exceeds the Claude API 30MB upload limit (%{size} bytes); local Claude Code has no documented size limit
    suggestion: Remove large assets or split the skill into smaller parts
  as_016:
    message: 'Failed to parse SKILL.md: %{error}'
    suggestion: Check YAML frontmatter syntax -- ensure proper indentation, colon spacing, and matching quotes
  as_017:
    message: Skill name '%{name}' must match parent directory '%{directory}'
    suggestion: Rename the skill directory or update the name field so they match
    opencode_2: "Skill name '%{name}' does not match directory '%{directory}'; OpenCode 2 uses the directory as the skill ID and the name only as a label, but OpenCode 1 and other clients require them to match"
  as_020:
    message: Skill description says what the skill does but not when to use it
    suggestion: Add a trigger such as 'Use when ...' so the agent knows when to load the skill
    body_section_suggestion: Move the 'When to use' guidance from the body into the description; agents pick skills from the
      description and read the body only after loading the skill
  as_021:
    message: SKILL.md body is about %{tokens} tokens; the Agent Skills spec recommends instructions under %{limit} tokens
    suggestion: Move detail into references/ files and say when to read each one
    claude_suggestion: Move detail into references/ files and say when to read each one; after compaction Claude Code re-attaches only the first 5,000 tokens of an invoked skill, so keep the steps that must survive near the top
  as_022:
    message: Script '%{script}' prompts for interactive input (%{pattern}); agents run non-interactive shells, so it hangs
    suggestion: Accept input through command-line flags, environment variables or stdin
  as_023:
    message: Bundled file '%{path}' is not mentioned in SKILL.md or another skill file, so the agent may not know it exists
    suggestion: List '%{path}' in SKILL.md and say when to use it, or remove it
  as_024:
    message: Command runs '%{package}' without a pinned version
    suggestion: Pin a version (for example 'npx eslint@9.0.0') so the skill behaves the same over time
  as_025:
    message: Skill '%{name}' is also defined in %{other}; %{clients} read both locations, so one copy is shadowed
    suggestion: Rename one skill or keep a single copy, unless the override is intended
  as_026:
    message: Generic pointer to bundled docs without saying when to read them
    suggestion: Say when to load the reference (for example 'Read references/api-errors.md if the API returns a non-200 status')
  as_027:
    description: The skill description is an unfinished [TODO:] scaffold placeholder
    instructions: The skill instructions contain an unfinished [TODO:] scaffold placeholder
    suggestion: Replace the placeholder with the real text before sharing the skill
  cc_sk_001:
    message: 'Invalid model ''%{model}''. Must be one of: %{valid}'
    suggestion: 'Use one of the valid model values: %{valid}'
  cc_sk_002:
    message: Invalid context '%{context}'. Must be 'fork' or omitted
    suggestion: Set context to 'fork' or remove the field entirely
  cc_sk_004:
    message: 'Agent field requires ''context: fork'''
    suggestion: 'Add ''context: fork'' to the frontmatter'
  cc_sk_005:
    message: Invalid agent type '%{agent}'. Must be Explore, Plan, general-purpose, or a custom kebab-case name (1-64 chars)
    suggestion: Use a built-in agent (Explore, Plan, general-purpose) or a custom kebab-case name
    fix: Replace invalid agent with 'general-purpose'
  cc_sk_006:
    message: 'Skill ''%{name}'' looks like a workflow with side effects, but Claude may invoke it on its own; set ''disable-model-invocation: true'' to run it only when you type /%{name}'
    suggestion: 'Add ''disable-model-invocation: true'' to the frontmatter'
  cc_sk_007:
    message: Unrestricted Bash access detected. Consider using scoped version for better security.
    suggestion: Use scoped Bash like 'Bash(git:*)' or 'Bash(npm:*)' instead of plain 'Bash'
    fix: Replace unrestricted Bash with scoped Bash(git:*)
  cc_sk_008:
    message: 'Unknown tool ''%{tool}''. Known tools: %{known}. MCP tools must use lowercase mcp__<server> or mcp__<server>__<tool>
      format'
    suggestion: 'Use one of the known Claude Code tools: %{known}, or a valid MCP tool (mcp__<server> or mcp__<server>__<tool>,
      case-sensitive lowercase prefix, no glob in the server segment)'
  cc_sk_009:
    message: Too many dynamic injections (%{count}). Limit to %{max} for better performance
    suggestion: Consider moving complex logic to a scripts/ directory or reducing injections
  cc_sk_010:
    message: 'Invalid hooks configuration in skill frontmatter: %{error}'
    suggestion: Ensure hooks follow the same schema as settings.json hooks
  cc_sk_012:
    message: argument-hint is set but body does not reference $ARGUMENTS
    suggestion: Add $ARGUMENTS to the skill body or remove the argument-hint field
  cc_sk_013:
    message: 'context: fork with reference-only content lacks actionable instructions'
    suggestion: Add imperative instructions for the forked agent to follow
  cc_sk_014:
    message: disable-model-invocation has invalid boolean value %{value}
    suggestion: Use true/false, yes/no, on/off, or 1/0 (quoted or unquoted)
  cc_sk_015:
    message: user-invocable has invalid boolean value %{value}
    suggestion: Use true/false, yes/no, on/off, or 1/0 (quoted or unquoted)
  cc_sk_016:
    message: Body uses indexed $ARGUMENTS[n] but argument-hint is missing
    suggestion: Add argument-hint to frontmatter so the / menu shows which arguments to type (agnix suggestion; the field is an autocomplete hint)
  cc_sk_017:
    message: Unknown frontmatter field '%{field}'
    suggestion: Remove unsupported fields or fix typos in frontmatter keys
  cx_sk_004:
    message: "The %{count} skills in this skills directory use about %{chars} characters of name, description and path metadata; Codex limits its initial skill list to 2% of the context window, or %{limit} characters when the window is unknown, and shortens descriptions or omits skills beyond that"
    suggestion: Shorten skill descriptions (front-load the key use case), or raise skills.max_context_tokens (capped at 10000)
  cx_sk_006:
    ignored: "Codex ignores %{field}: %{reason}"
    empty: the value is empty
    too_long: "it has %{length} characters (at most %{max})"
    bad_color: "'%{value}' is not #RRGGBB"
    type_error: "%{field} must be %{expected}; Codex ignores this whole agents/openai.yaml"
    parse_error: "Codex cannot parse agents/openai.yaml (%{error}) and ignores its interface, dependencies and policy"
    root_type: agents/openai.yaml must be a mapping; Codex ignores it
    dependency: "dependencies.tools entry %{index} has no %{fields}; Codex drops it"
    suggestion: Fix the field so Codex reads it (see the skill-creator openai_yaml reference)
  cx_sk_007:
    message: "Skill folder contains %{files}; Codex's skill guidance says to avoid a README, installation guide or changelog inside a skill"
    suggestion: Keep only files the skill uses; put needed material in SKILL.md or references/
  per_client_skill:
    other_client_field: '%{client} ignores skill frontmatter field ''%{field}'', which other skill clients act on'
    other_client_field_suggestion: Remove '%{field}' if no tool that reads this skill needs it, or move it under metadata
    data_field: '%{client} ignores skill frontmatter field ''%{field}'''
    data_field_suggestion: Move '%{field}' under metadata, where skills keep extra data such as author or version
    codex_compatibility: Codex's skill validator (quick_validate.py) rejects 'compatibility', and the Codex runtime ignores
      it
    codex_compatibility_suggestion: Keep 'compatibility' if other clients read this skill; the Agent Skills spec defines it
  kr_sk_001:
    message: "Kiro ignores skill frontmatter field '%{field}' (a field other skill clients act on), so it has no effect in Kiro"
    suggestion: "Kiro reads only name, description, license, compatibility and metadata; remove '%{field}', or move it under metadata if no other tool needs it"
  kr_sk_001_tools:
    message: "Kiro ignores skill frontmatter field '%{field}', so this skill does not restrict tools in Kiro"
    suggestion: "Restrict tools with the Kiro agent's tools and permissions settings; remove '%{field}' if no other tool needs it"
  kr_sk_001_data:
    message: "Kiro ignores skill frontmatter field '%{field}'; it reads only name, description, license, compatibility and metadata"
    suggestion: "Move '%{field}' under metadata, where Kiro skills keep extra data such as author or version"
  kr_sk_002:
    message: "Skill description '%{description}' is too vague for Kiro to match requests against"
    suggestion: "Describe what the skill does and when to use it, with specific keywords and actions (e.g. 'Review pull requests for security vulnerabilities and test coverage. Use when reviewing PRs.')"
  amp_001:
    missing_frontmatter: 'Amp check file has no YAML frontmatter; the review-checks plugin applies only checks with valid frontmatter and a non-empty `name`'
    not_mapping: 'Amp check frontmatter must be a YAML mapping of keys such as `name` and `description`'
    invalid_yaml: 'Invalid YAML frontmatter in Amp check file: %{error}'
    invalid_yaml_suggestion: 'Fix the YAML syntax of the frontmatter between the --- lines.'
    missing_name: 'Amp check frontmatter needs a non-empty `name`'
    empty_body: 'Amp check has no check instructions after the frontmatter'
    format_suggestion: 'ampcode.com/docs/review: "Each check must have valid YAML frontmatter with a non-empty `name`, followed by non-empty check instructions". The documented keys are name, description and severity-default.'
    unknown_key: "Unknown Amp check frontmatter key '%{key}'"
    unknown_key_suggestion: 'The check format documents name, description and severity-default (ampcode.com/docs/review, "Check File Format"). Remove or rename the key.'
    description_type: 'Amp check `description` must be a string'
    tools_type: 'Amp check `tools` must be a string or an array of strings'
    fix_remove: "Remove unknown check key '%{key}'"
  amp_002:
    invalid: "Invalid severity-default value '%{value}' (expected low, medium, high or critical)"
    not_string: 'severity-default must be a string (low, medium, high or critical)'
    suggestion: 'ampcode.com/docs/review: "`severity-default` is optional. Its value must be `low`, `medium`, `high`, or `critical`."'
    fix: "Replace severity-default with '%{value}'"
  amp_003:
    invalid_pattern: "Invalid `globs` pattern '%{pattern}' (%{error}); this file is @-mentioned from %{agents}"
    not_list: '`globs` must be a string or an array of strings; this file is @-mentioned from %{agents}'
    non_string_item: '`globs` must contain only string patterns; this file is @-mentioned from %{agents}'
    suggestion: 'ampcode.com/docs/customize/agents-md: "Mentioned files with `globs` will only be included if Amp has read a file matching any of the globs" and "Globs are implicitly prefixed with `**/` unless they start with `../` or `./`". Fix the patterns so %{agents} includes this file when intended.'
  amp_004:
    parse_error: 'Amp settings file is not valid JSON: %{error}'
    parse_error_suggestion: 'Fix the JSON syntax. Amp reads settings.json and settings.jsonc; agnix accepts // and /* */ comments and trailing commas in both.'
    root_not_object: 'Amp settings must be a JSON object, found %{found}'
    root_not_object_suggestion: 'Put the settings in one top-level object, for example {"amp.showCosts": true}.'
    unknown_key: "'%{key}' is not in Amp's settings schema; all Amp settings use the `amp.` prefix"
    unknown_amp_key: "'%{key}' is not a documented Amp setting"
    unknown_key_suggestion: 'Check the key against ampcode.com/docs/cli/settings and the settings schema (ampcode.com/cli-settings.schema.json).'
    did_you_mean: "Did you mean '%{suggested}'? The documented keys are on ampcode.com/docs/cli/settings."
    fix_remove: "Remove settings key '%{key}'"
    type: "Amp setting '%{key}' should be %{expected}, found %{found}"
    type_suggestion: 'Use the type the Amp settings schema gives (ampcode.com/cli-settings.schema.json; add "$schema": "https://ampcode.com/cli-settings.schema.json" for editor validation).'
    keymap_entry: "amp.keymap entry '%{entry}' should be a string, an array of strings or null, found %{found}"
    visibility: "amp.defaultVisibility value for '%{entry}' should be private, workspace or group, found %{found}"
    updates_mode: "amp.updates.mode '%{value}' is not one of auto, warn or disabled"
    compatibility_date_format: "amp.admin.compatibilityDate '%{value}' does not use the YYYY-MM-DD format"
    compatibility_date_managed: 'amp.admin.compatibilityDate is documented only for managed settings; in this file it may have no effect'
    compatibility_date_managed_suggestion: 'ampcode.com/docs/cli/settings: "Both the local file and the workspace document support one additional field" (managed-settings.json and the workspace Managed Settings document). Move it there.'
  amp_005:
    message: 'Skill defines MCP servers in both `mcpServers` frontmatter and a sibling mcp.json; Amp uses `mcpServers` and ignores mcp.json'
    suggestion: 'ampcode.com/docs/customize/skills: "If both are present, Amp uses `mcpServers` and ignores `mcp.json`." Keep the servers in one place: move them into mcpServers and delete mcp.json, or remove mcpServers.'
  amp_006:
    url: "`${amp:id-token}` in the url of MCP server '%{server}'; Amp rejects it in URLs"
    command: "`${amp:id-token}` in the command of MCP server '%{server}'; Amp rejects it in the command of local servers"
    args: "`${amp:id-token}` in the args of MCP server '%{server}'; Amp rejects it in the arguments of local servers"
    env: "`${amp:id-token}` in the env of MCP server '%{server}'; Amp rejects it in the environment of local servers"
    headers_not_https: "`${amp:id-token}` in the headers of MCP server '%{server}', whose url is not https://; Amp accepts it only in headers of HTTPS servers"
    headers_oauth: "`${amp:id-token}` in the headers of MCP server '%{server}', which has OAuth configuration; Amp accepts it only in headers of servers without OAuth"
    suggestion: 'ampcode.com/docs/customize/mcp: "`${amp:id-token}` works only in headers of HTTPS servers without OAuth configuration. Amp rejects it in URLs and in the command, arguments, and environment of local servers. A local server that needs a token can run `amp orb id-token` itself."'
  amp_007:
    not_array: 'amp.mcpPermissions must be an array of rules, found %{found}'
    rule_not_object: 'amp.mcpPermissions[%{index}] must be an object with matches and action, found %{found}'
    rule_key: "amp.mcpPermissions[%{index}] has key '%{key}'; a rule has only matches and action"
    matches_missing: 'amp.mcpPermissions[%{index}] has no matches object'
    matches_not_object: 'amp.mcpPermissions[%{index}].matches must be an object, found %{found}'
    matches_key: "amp.mcpPermissions[%{index}].matches has key '%{key}'; Amp matches local servers by command and args and remote servers by url"
    mixed: 'amp.mcpPermissions[%{index}].matches combines url with command or args; a server is either remote (url) or local (command, args), so this rule never matches'
    action_missing: 'amp.mcpPermissions[%{index}] has no action'
    action_invalid: 'amp.mcpPermissions[%{index}].action must be "allow" or "reject", found %{found}'
    suggestion: 'ampcode.com/docs/cli/settings: "In `amp.mcpPermissions`, each rule''s `matches` must be an object, such as `{"command":"*"}`, not a string. The workspace settings editor rejects invalid MCP permissions without changing the saved policy." For example {"matches": {"url": "https://mcp.trusted.com/mcp"}, "action": "allow"}.'
  amp_008:
    message: "Skill MCP server '%{server}' has no includeTools; every tool it offers is exposed once the skill loads"
    suggestion: 'ampcode.com/docs/customize/skills: "`includeTools` (`string[]`, optional but recommended) contains tool names or glob patterns used to choose which tools are exposed." For example "includeTools": ["list_issues", "create_*"].'
  amp_010:
    parse_error: 'Skill mcp.json is not valid JSON, so Amp cannot load its MCP servers: %{error}'
    root_not_object: 'Skill mcp.json must be an object of server names to server entries, found %{found}'
    frontmatter_not_mapping: 'Skill frontmatter mcpServers must be a mapping of server names to server entries, found %{found}'
    entry_not_object: "MCP server '%{server}' must be an object, found %{found}"
    no_transport: "MCP server '%{server}' has neither command (local server) nor url (remote server)"
    both_transports: "MCP server '%{server}' has both command and url; a server is either local (command) or remote (url)"
    field_type: "MCP server '%{server}' field '%{field}' should be %{expected}, found %{found}"
    transport: "MCP server '%{server}' transport '%{value}' is not one of http, sse or http-first"
    oauth_missing: "MCP server '%{server}' oauth is missing %{fields}"
    suggestion: 'Local servers take command (string), args (string[]) and env (object); remote servers take url (string) and headers (object); includeTools is a string[] (ampcode.com/docs/customize/skills, "MCP Servers in Skills"; ampcode.com/cli-settings.schema.json).'
  amp_sk_002:
    message: "Amp ignores this skill: '%{name}' is also defined in %{other}, which Amp loads first"
    suggestion: 'ampcode.com/docs/customize/skills: "Amp uses the first skill with a given frontmatter `name`", and .agents/skills/ comes before .claude/skills/. Keep one copy, make the copies identical, or rename one.'
  amp_sk_003:
    message: 'Amp does not discover this skill: its directory is %{depth} directories below the skills root %{root}, and Amp searches up to five'
    suggestion: 'ampcode.com/docs/customize/skills: "Amp searches local skill directories recursively, up to five directories below each skills root." Move the skill directory closer to the root.'
  xp_sk_001:
    message: skill uses client-specific field '%{field}' which is not part of the universal Agent Skills spec
    suggestion: Consider removing '%{field}' for cross-platform portability
  xp_sk_002:
    message: Hardcoded user directory path '%{path}' leaks author identity and is not portable across machines
