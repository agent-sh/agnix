    message: 'Invalid author object: ''author.name'' must be a non-empty string'
    suggestion: Set 'author.name' to a non-empty string
  cc_pl_010:
    message: 'Plugin homepage ''%{url}'' does not parse as a URL, so the plugin fails to load'
    suggestion: Set homepage to an absolute URL such as https://example.com/docs, or remove it
