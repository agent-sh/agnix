    interpreter_message: "Allow rule '%{rule}' approves an interpreter with any arguments, which runs arbitrary code; Claude Code drops wildcarded interpreters when auto mode starts"
    program_wildcard_message: "Allow rule '%{rule}' starts with *, so any program matches"
    runner_message: "Allow rule '%{rule}' approves whatever command follows the runner, including arbitrary code"
    script_runner_message: "Allow rule '%{rule}' runs any script the repository defines; Claude Code drops package-manager run commands when auto mode starts"
    agent_message: "Allow rule '%{rule}' approves every subagent; Claude Code drops Agent allow rules when auto mode starts"
    monitor_message: "Allow rule '%{rule}' approves every Monitor command, which runs through the shell; Claude Code drops Monitor allow rules when auto mode starts"
