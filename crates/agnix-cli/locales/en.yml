    self_hosted_environment_suggestion: "Set the self-hosted environment ID in ~/.claude/settings.json, or pick it with /remote-env."
  cc_set_035:
    malformed_message: "Permission rule '%{rule}' is malformed, so Claude Code skips it: rules take the form Tool or Tool(content) and must end at the closing parenthesis"
    malformed_suggestion: "Rewrite the rule so it ends at its closing parenthesis, for example Bash(ls *) instead of Bash(ls) x."
    mcp_parentheses_message: "Permission rule '%{rule}' is skipped: Claude Code skips any mcp__ rule with parentheses in a settings file"
    mcp_parentheses_suggestion: "Use the tool name without parentheses (mcp__server__tool), or pass a parameter rule with --disallowedTools."
    primary_field_message: "Permission rule '%{rule}' is ignored: a parameter rule can't match the primary field '%{field}', because a compound command would bypass it"
    primary_field_suggestion: "Use the tool's own specifier instead, such as Bash(rm *), Read(./path), or WebFetch(domain:host)."
    unanchored_glob_message: "Allow rule '%{rule}' is skipped and approves nothing: allow rules accept tool-name globs only after a literal mcp__<server>__ prefix"
    unanchored_glob_suggestion: "Name the server, for example mcp__github__*, or list the tools to allow."
    colon_star_message: "In '%{rule}' the ':*' is not at the end, so Claude Code reads the colon as a literal character and the rule matches nothing it was meant to"
    colon_star_suggestion: "Use ':*' only as a trailing wildcard, or write the space form, for example Bash(git push *)."
    wildcard_subcommand_message: "Allow rule '%{rule}' has a * before the subcommand, so it also approves any options inserted there (for git, -c and --exec-path can run arbitrary commands); Claude Code warns about it at startup"
    wildcard_subcommand_suggestion: "Replace the * with the exact value, or put every * after the subcommand, for example Bash(git status *)."
    single_slash_message: "In '%{rule}' the path '%{specifier}' starts with one slash, which anchors at the settings source, not the filesystem root"
    single_slash_suggestion: "Write %{tool}(/%{specifier}) with two leading slashes for an absolute path, or ~/ for a home-relative path."
