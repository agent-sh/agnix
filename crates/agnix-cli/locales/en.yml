    space_message: "Import @%{import} ends at the first space, so Claude Code looks for '%{import}' instead of '%{intended}'"
    space_suggestion: "Put a backslash before each space in the path: %{escaped}"
  cc_mem_020:
    message: "%{file} holds personal settings or notes and no .gitignore rule covers it, so it can be committed"
    suggestion: "Add %{file} to .gitignore."
  cc_mem_021:
    tree_message: "CLAUDE.md has a %{lines}-line directory tree; Claude can derive directory layouts from the code, and /doctor proposes cutting them"
    listing_message: "CLAUDE.md has a %{items}-item file-by-file listing; Claude Code's best practices list file-by-file descriptions of the codebase as content to leave out"
    suggestion: "Keep the parts of the layout Claude would get wrong (pitfalls, rationale, conventions that differ from tool defaults) and cut the rest."
  cc_os_003:
    message: "Output style frontmatter has unknown key '%{key}'; Claude Code ignores misspelled fields without an error"
    suggestion: "Use name, description or keep-coding-instructions, or check the key for typos."
    plugin_only_message: "force-for-plugin applies only to output styles shipped in a plugin; Claude Code ignores it in .claude/output-styles/"
