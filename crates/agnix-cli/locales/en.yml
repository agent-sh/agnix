    scheme_suggestion: Use an https:// documentation URL
  cc_pl_015:
    message: Default component folder '%{component}' exists but plugin.json overrides '%{component}' without including './%{component}'
    suggestion: Add './%{component}' to '%{component}' or move those files into the configured component path
  cdx_pl_001:
    message: plugin.json must be located in .codex-plugin/ directory
    suggestion: Move plugin.json to .codex-plugin/plugin.json
