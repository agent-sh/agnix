    user_or_managed_message: "'%{key}' has no effect in %{file}: Claude Code reads it only from user settings, --settings, or managed settings"
    user_or_managed_suggestion: "Move '%{key}' to ~/.claude/settings.json, or remove it from the repository."
    user_local_or_managed_message: "'%{key}' has no effect in %{file}: a repository's shared settings can't set it; Claude Code reads it from user, local, or managed settings"
