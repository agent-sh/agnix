# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = io.agnix
pluginName = agnix
pluginRepositoryUrl = https://github.com/agent-sh/agnix
# SemVer format -> https://semver.org
pluginVersion = 0.41.1

# Supported build number ranges and IntelliJ Platform Versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 233
pluginUntilBuild = 262.*

# IntelliJ Platform Properties
platformType = IC
platformVersion = 2023.3

# Gradle Configuration
# Kotlin 1.9.x is retained for the 2023.3 compatibility floor; it is not Gradle 9 configuration-cache compatible.
org.gradle.configuration-cache = false
org.gradle.caching = true
kotlin.stdlib.default.dependency = false

# Java VM Options
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Gradle Wrapper
gradleVersion = 9.6.1
