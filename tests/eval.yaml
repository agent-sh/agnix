# Evaluation manifest for agnix rule efficacy testing
# Each case specifies a file and the expected rule IDs that should fire
#
# Note: Some files trigger multiple rules. The expected list should include ALL
# rules that fire for accurate evaluation.

cases:
  # ===== Skill Rules (AS-*, CC-SK-*) =====

  - file: fixtures/skills/missing-frontmatter/SKILL.md
    expected: [AS-001]
    description: "Missing frontmatter triggers AS-001"

  - file: fixtures/skills/deep-reference/SKILL.md
    expected: [AS-013]
    description: "Deep reference triggers AS-013"

  - file: fixtures/invalid/skills/invalid-name/SKILL.md
    expected: [AS-004, AS-017, XP-SK-001]
    description: "Invalid skill name (underscores) triggers AS-004"

  - file: fixtures/invalid/skills/deploy-prod/SKILL.md
    expected: [CC-SK-006, CC-SK-007, AS-020]
    description: "Dangerous deploy-prod with unknown tools triggers multiple rules"

  - file: fixtures/invalid/skills/unknown-tool/SKILL.md
    expected: [AS-017, CC-SK-008]
    description: "Unknown tool triggers CC-SK-008 (unknown tool names)"

  - file: fixtures/invalid/skills/name-directory-mismatch/SKILL.md
    expected: [AS-017]
    description: "Name-directory mismatch triggers AS-017"

  - file: fixtures/invalid/skills/vague-name/SKILL.md
    expected: [AS-017, CC-SK-033]
    description: "Vague skill name with name-directory mismatch triggers AS-017 and CC-SK-033"

  - file: fixtures/invalid/skills/indexed-arguments-no-hint/SKILL.md
    expected: [CC-SK-016]
    description: "Indexed $ARGUMENTS[n] without argument-hint triggers CC-SK-016"

  - file: fixtures/invalid/skills/unknown-frontmatter-field/SKILL.md
    expected: [CC-SK-017]
    description: "Unknown frontmatter field triggers CC-SK-017 (XP-SK-001 leaves a field CC-SK-017 reports to it)"

  - file: fixtures/invalid/skills/invalid-model/SKILL.md
    expected: [AS-017, CC-SK-001, XP-SK-001]
    description: "Invalid model file has bad name, triggers CC-SK-001"

  - file: fixtures/invalid/skills/invalid-context/SKILL.md
    expected: [AS-017, CC-SK-002, XP-SK-001]
    description: "Invalid context triggers CC-SK-002"

  - file: fixtures/invalid/skills/invalid-agent/SKILL.md
    expected: [AS-017, CC-SK-005, XP-SK-001]
    description: "Invalid agent triggers CC-SK-005"

  - file: fixtures/invalid/skills/agent-without-context/SKILL.md
    expected: [AS-017, CC-SK-004, XP-SK-001]
    description: "Agent without context fork triggers CC-SK-004"

  - file: fixtures/valid/skills/code-review/SKILL.md
    expected: []
    description: "Valid skill should have no errors"

  - file: fixtures/valid/skills/social-source-evidence/SKILL.md
    expected: []
    description: "Valid social source skill should have no errors"

  - file: fixtures/valid/skills/with-context-agent/SKILL.md
    expected: [XP-SK-001]
    description: "Valid skill with context and agent triggers XP-SK-001 (not in client-specific dir)"

  # ===== MCP Rules (MCP-*) =====

  - file: fixtures/mcp/invalid-jsonrpc-version.mcp.json
    expected: [MCP-001]
    description: "Invalid jsonrpc version triggers MCP-001"

  - file: fixtures/mcp/missing-required-fields.mcp.json
    expected: [MCP-002, MCP-004]
    description: "Missing inputSchema triggers MCP-002; missing description also triggers advisory MCP-004"

  - file: fixtures/mcp/invalid-input-schema.mcp.json
    expected: [MCP-003]
    description: "Invalid input schema triggers MCP-003"

  - file: fixtures/mcp/empty-description.mcp.json
    expected: [MCP-004, MCP-033]
    description: "Empty description triggers MCP-004"

  - file: fixtures/mcp/missing-consent.mcp.json
    expected: []
    description: "Tool schemas do not require a consent field"

  - file: fixtures/mcp/untrusted-annotations.mcp.json
    expected: [MCP-006, MCP-033]
    description: "Untrusted annotations triggers MCP-006"

  - file: fixtures/mcp/protocol-version-mismatch.mcp.json
    expected: [MCP-008]
    description: "Protocol version mismatch triggers MCP-008"

  - file: fixtures/mcp/missing-command-stdio.mcp.json
    expected: [MCP-009]
    description: "Stdio server without command triggers MCP-009"

  - file: fixtures/mcp/missing-url-http.mcp.json
    expected: [MCP-010]
    description: "HTTP server without URL triggers MCP-010"

  - file: fixtures/mcp/invalid-server-type.mcp.json
    expected: [MCP-011]
    description: "Invalid server type triggers MCP-011"

  - file: fixtures/mcp/deprecated-sse.mcp.json
    expected: [MCP-012]
    description: "SSE transport triggers MCP-012"

  - file: fixtures/mcp/valid-tool.mcp.json
    expected: []
    description: "Valid MCP tool should have no errors"

  - file: fixtures/mcp/invalid-tool-name.mcp.json
    expected: [MCP-013, MCP-033]
    description: "Invalid tool name format triggers MCP-013"

  - file: fixtures/mcp/invalid-output-schema.mcp.json
    expected: [MCP-014, MCP-033]
    description: "Invalid outputSchema triggers MCP-014"

  - file: fixtures/mcp/missing-resource-required-fields.mcp.json
    expected: [MCP-015]
    description: "Resource missing required uri/name triggers MCP-015"

  - file: fixtures/mcp/missing-prompt-name.mcp.json
    expected: [MCP-016]
    description: "Prompt missing required name triggers MCP-016"

  - file: fixtures/mcp/insecure-http-server.mcp.json
    expected: [MCP-017]
    description: "Remote HTTP server URL without HTTPS triggers MCP-017"

  - file: fixtures/mcp/plaintext-env-secret.mcp.json
    expected: [MCP-018]
    description: "Plaintext secret-like env var triggers MCP-018"

  - file: fixtures/mcp/dangerous-stdio-command.mcp.json
    expected: [MCP-019]
    description: "Dangerous stdio command pattern triggers MCP-019"

  - file: fixtures/mcp/invalid-capability-key.mcp.json
    expected: [MCP-020]
    description: "Unknown capability key triggers MCP-020"

  - file: fixtures/mcp/wildcard-http-binding.mcp.json
    expected: [MCP-021, MCP-017]
    description: "Wildcard HTTP binding triggers MCP-021 (insecure http:// URL also triggers MCP-017)"

  - file: fixtures/mcp/invalid-args-type.mcp.json
    expected: [MCP-022]
    description: "Non-array args value triggers MCP-022"

  - file: fixtures/mcp/duplicate-server-names.mcp.json
    expected: [MCP-023]
    description: "Duplicate mcpServers keys trigger MCP-023"

  - file: fixtures/mcp/empty-server-config.mcp.json
    expected: [MCP-024]
    description: "Empty mcpServers entry triggers MCP-024 (MCP-009 no longer reports the same empty entry a second time)"

  # ===== AGENTS.md Rules (AGM-*) =====

  - file: fixtures/agents_md/invalid-markdown/AGENTS.md
    expected: [AGM-001]
    description: "Unclosed code block triggers AGM-001"

  - file: fixtures/agents_md/no-headers/AGENTS.md
    expected: [AGM-002]
    description: "A long file without headings triggers AGM-002"

  # AGM-003 was retired in 0.59.0; WS-011 reports Windsurf's limit
  - file: fixtures/devin/invalid/AGENTS.md
    expected: [WS-011]
    description: "Exceeding the Windsurf character limit in a Devin Desktop project triggers WS-011 (the fixture's .devin/rules/ directory puts Windsurf in scope)"

  - file: fixtures/agents_md/no-context/AGENTS.md
    expected: [AGM-004]
    description: "Missing context/purpose triggers AGM-004"

  # CDX-AG-006 needs a short file (under 200 characters) with no heading,
  # inline code or path; the other AGENTS.md fixtures have one of those
  - file: fixtures/agents_md/codex-missing-context/AGENTS.md
    expected: [AGM-004, CDX-AG-006]
    description: "A short AGENTS.md with no heading, command or path triggers CDX-AG-006 (Codex: missing project context) and AGM-004"

  # AGM-007 needs a build manifest next to the file; the other AGENTS.md
  # fixtures have none, so it stays quiet there
  - file: fixtures/agents_md/no-commands/AGENTS.md
    expected: [AGM-007]
    description: "A buildable project whose AGENTS.md lists no build or test command triggers AGM-007"

  - file: fixtures/agents_md/unguarded-platform/AGENTS.md
    expected: [XP-001]
    description: "Hook and skill configuration in AGENTS.md triggers XP-001"

  - file: fixtures/agents_md/valid/AGENTS.md
    expected: []
    description: "Valid AGENTS.md with guarded Claude section - no errors"

  # ===== Cross-Platform Rules (XP-*) =====

  - file: fixtures/cross_platform/with-hooks/AGENTS.md
    expected: [XP-001]
    description: "Hook definitions in AGENTS.md trigger XP-001"

  - file: fixtures/cross_platform/with-context-fork/AGENTS.md
    expected: [XP-001, AGM-004]
    description: "Context fork triggers XP-001 and AGM-004"

  # A short file without headings is fine; it lacks context and commands
  - file: fixtures/cross_platform/no-headers/AGENTS.md
    expected: [AGM-004]
    description: "Headings are optional in a short AGENTS.md; missing context triggers AGM-004"

  # Hard-coded paths file also lacks context section
  - file: fixtures/cross_platform/hard-coded/AGENTS.md
    expected: [XP-003, AGM-004, CDX-AG-005]
    description: "Hard-coded paths trigger XP-003 and AGM-004 (Codex also flags them: CDX-AG-005)"

  - file: fixtures/cross_platform/valid/AGENTS.md
    expected: []
    description: "Valid cross-platform AGENTS.md should have no errors"

  # ===== XML Rules (XML-*) =====

  - file: fixtures/xml/xml-001-unclosed.md
    expected: [XML-001]
    description: "Unclosed XML tag triggers XML-001"

  - file: fixtures/xml/xml-002-mismatch.md
    expected: [XML-002]
    description: "Crossed XML tags trigger XML-002 once (the out-of-order closing tag no longer also counts as an unclosed XML-001)"

  - file: fixtures/xml/xml-003-unmatched.md
    expected: [XML-003]
    description: "Unmatched closing tag triggers XML-003"

  - file: fixtures/xml/xml-valid.md
    expected: []
    description: "Valid XML should have no errors"

  # ===== Reference/Import Rules (REF-*) =====

  - file: fixtures/refs/missing-import.md
    expected: [REF-001]
    description: "Missing import file triggers REF-001"

  - file: fixtures/refs/broken-link/CLAUDE.md
    expected: [REF-002]
    description: "Broken relative link triggers REF-002"

  - file: fixtures/refs/valid-links.md
    expected: []
    description: "Valid references should have no errors"

  # ===== Plugin manifests Copilot CLI reads (COP-019, COP-020, COP-039) =====

  - file: fixtures/plugin-manifests/copilot-legacy-invalid/plugin.json
    expected: [COP-020, COP-039]
    description: "Legacy Copilot root manifest (Copilot-only fields) gets the Copilot manifest rules"

  - file: fixtures/plugin-manifests/agent-plugins-invalid/plugin.json
    expected: [CDX-PL-004, COP-039]
    description: "Agent Plugins root manifest name violates the Agent Plugins name rule (Codex and Copilot)"

  - file: fixtures/plugin-manifests/agent-plugins-no-schema/plugin.json
    expected: [COP-019]
    description: "Agent Plugins layout (mcp.json) whose plugin.json has no $schema loads as a legacy plugin"

  - file: fixtures/plugin-manifests/claude-copilot-limits/.claude-plugin/plugin.json
    expected: []
    description: "Valid Claude Code manifest gets no Copilot rule in an unscoped run"

  # ===== Real-World Regression Tests =====
  # Derived from real-world validation against 121 repos

  - file: fixtures/real-world/html5-void-elements/CLAUDE.md
    expected: []
    description: "HTML5 void elements (br, img, hr, input, source) should not trigger XML-001"

  - file: fixtures/real-world/type-parameters/CLAUDE.md
    expected: []
    description: "Type parameters (T, Option, Key, Value, TableName) should not trigger XML-001"

  - file: fixtures/real-world/absolute-paths/AGENTS.md
    expected: [XP-003]
    description: "Hard-coded home directories (/Users/<name>/, /home/<name>/) should trigger XP-003"
